<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Pool Log</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>

:root{
--bg:#0b0b10;
--card:#14141c;
--muted:#9ca3af;
--text:#e5e7eb;
--line:#2a2a35;
--accent:#6f2dbd;
--accent-hover:#5a23a3;
--shadow:0 6px 25px rgba(0,0,0,0.4);
--radius:14px;
}

body{
font-family:system-ui;
background:
radial-gradient(circle at top left, rgba(111,45,189,0.15), transparent 40%),
radial-gradient(circle at bottom right, rgba(111,45,189,0.1), transparent 50%),
var(--bg);
padding:20px;
max-width:1100px;
margin:auto;
color:var(--text);
}

.banner{
margin-bottom:16px;
padding:10px 14px;
border-radius:10px;
background:rgba(111,45,189,0.15);
text-align:center;
font-weight:600;
}

.layout{
display:grid;
grid-template-columns:2fr 1fr;
gap:16px;
}

@media(max-width:900px){
.layout{grid-template-columns:1fr}
}

.grid{display:grid;gap:14px;}

.card{
background:var(--card);
border-radius:var(--radius);
padding:16px;
box-shadow:var(--shadow);
border:1px solid rgba(255,255,255,0.04);
}

button{
padding:10px 12px;
border:none;
border-radius:10px;
cursor:pointer;
background:var(--accent);
color:white;
font-weight:600;
}

button:hover{background:var(--accent-hover)}

.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}

.btnrow{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}

.tooltip{
position:relative;
cursor:pointer;
}

.tooltip:hover::after{
content:attr(data-tip);
position:absolute;
bottom:125%;
left:50%;
transform:translateX(-50%);
background:#111;
padding:6px 8px;
border-radius:6px;
font-size:11px;
white-space:nowrap;
}

.standings-table{
width:100%;
border-collapse:collapse;
}

.standings-table th,
.standings-table td{
padding:8px 6px;
text-align:left;
}

.standings-table tr{
border-bottom:1px solid var(--line);
}

.standings-table tr:first-child{
background:rgba(111,45,189,0.15);
font-weight:bold;
}

.history{
display:flex;
flex-direction:column;
gap:8px;
max-height:300px;
overflow-y:auto;
}

.history-item{
padding:10px;
border-radius:10px;
background:#11131a;
border:1px solid rgba(255,255,255,0.04);
}

.muted{font-size:12px;color:var(--muted)}

.king{
text-align:center;
padding:12px;
background:rgba(111,45,189,0.15);
border-radius:10px;
}

.rules{
font-size:13px;
line-height:1.5;
}

</style>
</head>

<body>

<h1>🎱 House Pool Log <span id="badge"></span></h1>

<div class="layout">

<div class="grid">

<div class="card">
<h2>📝 Log Game</h2>

<div class="row">
<select id="player1"></select>
<select id="player2"></select>
</div>

<div class="btnrow">
<button id="p1WinBtn"></button>
<button id="p2WinBtn"></button>
</div>

<div class="btnrow">
<select id="winType" class="tooltip" data-tip="How the game was won">
<option value="">Win Type</option>
<option>8 Ball</option>
<option>Opponent Scratch</option>
<option>Opponent Early 8</option>
<option>Scratch on 8</option>
</select>
</div>

<div class="btnrow">
<button id="rematchBtn" class="tooltip" data-tip="Swap players for next game">🔁 Rematch</button>
<button id="modeBtn" class="tooltip" data-tip="Switch between House and APA rules">🏠 House Mode</button>
<button id="kingModeBtn" class="tooltip" data-tip="Winner stays on table">👑 King: OFF</button>
</div>

<div id="h2h" class="muted"></div>

</div>

<div class="card">
<h2>👥 Players</h2>

<div class="row">
<input id="newPlayer" placeholder="Enter player name">
<button id="addPlayerBtn">Add Player</button>
</div>

</div>

<div class="card">
<details open>
<summary>🕙 Game History</summary>
<div id="history" class="history"></div>
<button id="deleteLastBtn">Undo Last Game</button>
</details>
</div>

<div class="card rules" id="rules"></div>

</div>

<div class="grid">

<div class="card">
<h2>👑 King</h2>
<div id="king" class="king"></div>
</div>

<div class="card">
<h2>🏆 Standings</h2>
<div id="standings"></div>
</div>

</div>

</div>

<script>

const VERSION="5.1.0"
document.getElementById("badge").textContent="v"+VERSION

const sb=supabase.createClient(
"https://wybycecwkvrukcfoqgpa.supabase.co",
"sb_publishable_nNpJJg1ZBcQSjbX1HhPeKg_5KeR8ngb"
)

let players=[],games=[]
let mode="house"
let kingMode=false
const K=20

async function loadData(){

const {data:p}=await sb.from("players").select("name").order("name")
players=p?.map(x=>x.name)||[]

const {data:g}=await sb.from("games").select("*").order("date",{ascending:false})
games=g||[]

await seedGames()

renderAll()
}

async function seedGames(){

if(games.some(g=>g.seed_tag==="kdub_seed")) return

let d=new Date()
d.setDate(d.getDate() - ((d.getDay()+4)%7))

for(let i=0;i<2;i++){
await sb.from("games").insert({
player1:"Kdub",
player2:"Stuffy",
winner:"Kdub",
date:d.toISOString(),
seed_tag:"kdub_seed"
})
}

const {data:g}=await sb.from("games").select("*").order("date",{ascending:false})
games=g||[]
}

function renderPlayers(){

const p1=player1.value
const p2=player2.value

player1.innerHTML=players.map(p=>`<option>${p}</option>`).join("")
player2.innerHTML=players.map(p=>`<option>${p}</option>`).join("")

if(players.includes(p1)) player1.value=p1
if(players.includes(p2)) player2.value=p2

updateButtons()
}

function updateButtons(){
p1WinBtn.textContent=(player1.value||"Player 1")+" Won"
p2WinBtn.textContent=(player2.value||"Player 2")+" Won"
renderH2H()
}

player1.onchange=updateButtons
player2.onchange=updateButtons

function renderH2H(){

let p1=player1.value,p2=player2.value
let w1=0,w2=0

games.forEach(g=>{
if((g.player1===p1&&g.player2===p2)||(g.player1===p2&&g.player2===p1)){
if(g.winner===p1)w1++
if(g.winner===p2)w2++
}
})

h2h.innerHTML=`${p1} leads ${p2} ${w1}-${w2}`
}

async function logWin(which){

let p1=player1.value
let p2=player2.value
let winner=which===1?p1:p2
let loser=which===1?p2:p1
let type=winType.value

if(mode==="apa"){
if(!type){alert("Select win type");return}
if(type==="Scratch on 8") winner=loser
}

await sb.from("games").insert({
player1:p1,
player2:p2,
winner,
win_type:type
})

if(kingMode){
player1.value=winner
}

loadData()
}

function computeStats(){

let stats={},elo={}

games.slice().reverse().forEach(g=>{

[g.player1,g.player2].forEach(p=>{
if(!stats[p])stats[p]={w:0,l:0}
if(!elo[p])elo[p]=1000
})

let w=g.winner
let l=w===g.player1?g.player2:g.player1

stats[w].w++
stats[l].l++

let exp=1/(1+Math.pow(10,(elo[l]-elo[w])/400))
elo[w]+=K*(1-exp)
elo[l]+=K*(0-(1-exp))
})

return {stats,elo}
}

function renderStandings(){

const {stats,elo}=computeStats()

const list=Object.entries(stats).sort((a,b)=>elo[b[0]]-elo[a[0]])

standings.innerHTML=`
<table class="standings-table">
<tr><th>#</th><th>Player</th><th>Record</th><th>ELO</th></tr>
${list.map(([p,s],i)=>`
<tr>
<td>${i+1}</td>
<td><b>${p}</b></td>
<td>${s.w}-${s.l}</td>
<td>${Math.round(elo[p])}</td>
</tr>
`).join("")}
</table>
`
}

function renderKing(){

if(!games.length){
king.innerHTML="No games yet"
return
}

let best=0,cur=0,last=null

games.slice().reverse().forEach(g=>{
if(g.winner===last){cur++}
else{cur=1;last=g.winner}
best=Math.max(best,cur)
})

king.innerHTML=`
👑 <b>${games[0].winner}</b><br>
🔥 Streak: ${cur}<br>
🏆 Best: ${best}
`
}

function renderHistory(){

history.innerHTML=games.map(g=>`
<div class="history-item">
<div class="muted">${new Date(g.date).toLocaleString()}</div>
<b>${g.winner}</b> beat ${g.winner===g.player1?g.player2:g.player1}
<br><span class="muted">${g.win_type||"quick win"}</span>
</div>
`).join("")
}

function renderRules(){

rules.innerHTML=`
<h3>📜 Rules</h3>

<b>🏠 House Rules (Default)</b><br>
Games are played casually. Shots do not need to be called and any ball that goes in counts. 
The game is won by legally pocketing the 8 ball. Scratching on the 8 ball results in a loss. 
Pocketing the 8 ball early results in a loss. Games are intended to be fast and friendly.<br><br>

<b>🎱 APA 8-Ball Rules</b><br>
Shots must be called. Players must strike their assigned group first. 
The 8 ball can only be attempted after clearing all group balls. 
Scratching on the 8 ball results in an automatic loss. 
Pocketing the 8 ball early results in a loss. Defensive shots are allowed.
`
}

function renderAll(){
renderPlayers()
renderStandings()
renderHistory()
renderKing()
renderRules()
updateButtons()
}

modeBtn.onclick=()=>{
mode=mode==="house"?"apa":"house"
modeBtn.textContent=mode==="house"?"🏠 House Mode":"🎱 APA Mode"
}

kingModeBtn.onclick=()=>{
kingMode=!kingMode
kingModeBtn.textContent=`👑 King: ${kingMode?"ON":"OFF"}`
}

rematchBtn.onclick=()=>{
let t=player1.value
player1.value=player2.value
player2.value=t
updateButtons()
}

p1WinBtn.onclick=()=>logWin(1)
p2WinBtn.onclick=()=>logWin(2)

loadData()

</script>

</body>
</html>

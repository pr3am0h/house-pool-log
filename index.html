<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Table Kings</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
:root{
--bg:#0b0b10;
--card:#14141c;
--text:#e5e7eb;
--muted:#9ca3af;
--accent:#6f2dbd;
--line:#2a2a35;
--radius:14px;
}

body{
font-family:system-ui;
background:var(--bg);
color:var(--text);
padding:14px;
max-width:900px;
margin:auto;
}

/* 🔥 NEW HEADER */
.hero{
text-align:center;
margin-bottom:18px;
}

.hero img{
width:140px;
max-width:60%;
border-radius:16px;
box-shadow:0 0 25px rgba(111,45,189,0.4);
margin-bottom:10px;
}

.hero h1{
margin:0;
font-size:28px;
letter-spacing:1px;
}

.hero p{
margin:4px 0 0;
font-size:13px;
color:var(--muted);
}

/* existing styles */

.card{
background:var(--card);
padding:14px;
border-radius:var(--radius);
margin-bottom:12px;
}

.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}

button{
padding:12px;
border:none;
border-radius:10px;
background:var(--accent);
color:white;
font-weight:bold;
cursor:pointer;
}

select,input{
padding:10px;
border-radius:10px;
border:none;
}

.small{font-size:12px;color:var(--muted)}

.leader{
display:flex;
justify-content:space-between;
padding:8px;
border-bottom:1px solid var(--line);
}

.stat{
background:#111;
padding:10px;
border-radius:10px;
margin-top:8px;
border:1px solid var(--line);
}

.tooltip{font-size:11px;color:var(--muted)}

details summary{
cursor:pointer;
font-weight:bold;
margin-bottom:6px;
}
</style>
</head>

<body>

<!-- 🔥 NEW BRAND HEADER -->
<div class="hero">
<img src="raven.png" alt="Table Kings Mascot">
<h1>👑 Table Kings</h1>
<p>House Pool Tracker</p>
</div>

<div class="card">

<div class="row">
<select id="player1"></select>
<select id="player2"></select>
</div>

<div class="row">
<button id="p1WinBtn"></button>
<button id="p2WinBtn"></button>
</div>

<div class="row">
<select id="winType">
<option value="">Win Type</option>
<option>8 Ball</option>
<option>Opponent Scratch</option>
<option>Opponent Early 8</option>
<option>Scratch on 8</option>
</select>
</div>

<div class="row">
<button id="rematchBtn">🔁 Rematch</button>
<button id="modeBtn">🏠 House Mode</button>
<button id="kingModeBtn">👑 King OFF</button>
</div>

<div class="tooltip">Rematch swaps players instantly</div>
<div class="tooltip">Mode enforces rules (APA requires win type)</div>
<div class="tooltip">King Mode keeps winner on table</div>

<div id="h2h" class="small"></div>

</div>

<div class="card">
<input id="newPlayer" placeholder="Player name">
<button id="addPlayerBtn">Add Player</button>
</div>

<div class="card" id="king"></div>
<div class="card" id="potn"></div>
<div class="card" id="standings"></div>
<div class="card" id="playerStats"></div>
<div class="card" id="h2hFull"></div>

<div class="card">
<div id="history"></div>
<button id="deleteLastBtn">Undo</button>
</div>

<div class="card" id="rules"></div>

<script>

/* KEEP ALL YOUR EXISTING JS EXACTLY THE SAME */

const sb=supabase.createClient(
"https://wybycecwkvrukcfoqgpa.supabase.co",
"sb_publishable_nNpJJg1ZBcQSjbX1HhPeKg_5KeR8ngb"
)

let players=[],games=[]
let mode="house"
let kingMode=false
const K=20

// (no changes below — everything remains stable)

async function injectManualGames(){
let date=new Date()
date.setDate(date.getDate()-((date.getDay()+4)%7))

let {data}=await sb.from("games")
.select("*")
.eq("player1","Kdub")
.eq("player2","Stuffy")
.eq("winner","Kdub")

if(data.length>=2)return

await sb.from("games").insert([
{player1:"Kdub",player2:"Stuffy",winner:"Kdub",date},
{player1:"Kdub",player2:"Stuffy",winner:"Kdub",date}
])
}

/* ... KEEP REST OF FILE IDENTICAL ... */

loadData()

</script>

</body>
</html>

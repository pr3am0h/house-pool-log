<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>House Pool Log</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>
:root{
  --bg:#f6f7fb;
  --card:#ffffff;
  --muted:#6b7280;
  --text:#111827;
  --line:#e5e7eb;
  --good:#0a7d2c;
  --bad:#b00020;
  --shadow:0 2px 10px rgba(0,0,0,0.06);
  --radius:12px;
}
body{
  font-family: system-ui, sans-serif;
  padding:16px;
  max-width:900px;
  margin:auto;
  background:var(--bg);
  color:var(--text);
}
h1{margin:4px 0 2px;}
h2{margin:0 0 10px;font-size:18px;}
.version{font-size:12px;color:var(--muted);margin-bottom:14px;}
.grid{display:grid;grid-template-columns:1fr;gap:14px;}
@media(min-width:860px){.grid{grid-template-columns:1fr 1fr;}}

.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:14px;
}

button{
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
  cursor:pointer;
  font-weight:600;
}
button:disabled{opacity:.5;}

select,input{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
}

.status{font-weight:700;margin:12px 0;}
.success{color:var(--good);}
.error{color:var(--bad);}

.row{display:flex;gap:10px;flex-wrap:wrap;}
.row>*{flex:1 1 160px;}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}
.btnrow>button{flex:1 1 160px;}

.pill{
  display:inline-block;
  font-size:12px;
  padding:3px 8px;
  border-radius:999px;
  background:#eef2ff;
  color:#3730a3;
  border:1px solid #e0e7ff;
  margin-left:8px;
}

.standings-item{
  padding:10px;
  border:1px solid var(--line);
  border-radius:10px;
  margin-bottom:8px;
}
.leader{background:#ecfdf3;border-color:#b7f7cd;}

.muted{color:var(--muted);font-size:12px;}

details summary{
  cursor:pointer;
  font-weight:800;
  padding:10px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
  list-style:none;
}
details summary::-webkit-details-marker{display:none;}
details .content{margin-top:10px;}

.game{
  padding:10px 0;
  border-bottom:1px solid var(--line);
  display:flex;
  gap:10px;
  align-items:flex-start;
}
.game:last-child{border-bottom:none;}
.time{font-size:12px;color:var(--muted);}
.main{font-weight:800;margin-top:2px;}
.meta{font-size:12px;margin-top:2px;color:#374151;}
</style>
</head>

<body>
<h1>🎱 House Pool Log <span class="pill" id="badge">v2.7.0</span></h1>

<div id="status" class="status"></div>

<div class="grid">

<div class="card">
<h2>🏆 Standings</h2>
<div id="standings"></div>
</div>

<div class="card">
<h2>📝 Log Game</h2>
<div class="row">
<select id="player1"></select>
<select id="player2"></select>
</div>

<div class="row">
<select id="grouping">
<option value="">Group (Optional)</option>
<option value="Solids">Solids</option>
<option value="Stripes">Stripes</option>
</select>

<select id="endCondition">
<option value="">End Condition</option>
<option>Clean win</option>
<option>Opponent scratched on 8</option>
<option>Opponent sank 8 early</option>
<option>Opponent missed 8</option>
</select>
</div>

<div class="btnrow">
<button id="p1WinBtn">Player 1 Won</button>
<button id="p2WinBtn">Player 2 Won</button>
</div>

<div class="btnrow">
<button id="deleteLastBtn">Delete last game</button>
<button id="undoBtn">Undo</button>
<button id="csvBtn">Export CSV</button>
</div>

</div>

<div class="card">
<h2>🕙 History</h2>
<details open>
<summary>Recent games</summary>
<div class="content" id="recentGames"></div>
<div style="margin-top:10px;">
<button id="deleteSelectedBtn">Delete Selected</button>
</div>
</details>
</div>

</div>

<script>
(() => {

const VERSION="2.7.0";
const SUPABASE_URL="https://wybycecwkvrukcfoqgpa.supabase.co";
const SUPABASE_KEY="sb_publishable_nNpJJg1ZBcQSjbX1HhPeKg_5KeR8ngb";
const K=20;
const DUP_GUARD_SECONDS=10;

const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let players=[];
let games=[];
let lastDeleted=null;

function setStatus(msg,type="success"){
  const el=document.getElementById("status");
  el.className="status "+(type==="error"?"error":"success");
  el.textContent=msg;
  setTimeout(()=>el.textContent="",3000);
}

function fmtDate(ts){
  return new Date(ts).toLocaleString();
}

async function loadData(){
  const {data:p}=await sb.from("players").select("name").order("name");
  players=p?.map(x=>x.name)||[];

  const {data:g}=await sb.from("games").select("*").order("date",{ascending:false});
  games=g||[];

  renderAll();
}

function computeStats(){
  const stats={},elo={},streak={};
  games.slice().reverse().forEach(g=>{
    [g.player1,g.player2].forEach(p=>{
      if(!stats[p])stats[p]={w:0,l:0};
      if(!elo[p])elo[p]=1000;
      if(streak[p]===undefined)streak[p]=0;
    });
    const winner=g.winner;
    const loser=winner===g.player1?g.player2:g.player1;
    stats[winner].w++;
    stats[loser].l++;
    streak[winner]++;
    streak[loser]=0;
    const exp=1/(1+Math.pow(10,(elo[loser]-elo[winner])/400));
    elo[winner]+=K*(1-exp);
    elo[loser]+=K*(0-(1-exp));
  });
  return{stats,elo,streak};
}

function renderStandings(){
  const {stats,elo,streak}=computeStats();
  const el=document.getElementById("standings");
  const entries=Object.entries(stats);
  if(!entries.length){el.innerHTML="No games yet.";return;}
  entries.sort((a,b)=>b[1].w-a[1].w);
  el.innerHTML=entries.map(([p,s],i)=>`
    <div class="standings-item ${i===0?'leader':''}">
      <b>${p}</b> ${s.w}-${s.l}
      <span class="pill">ELO ${Math.round(elo[p])}</span>
      <span class="muted">Streak ${streak[p]}</span>
    </div>
  `).join("");
}

function renderHistory(){
  const el=document.getElementById("recentGames");
  el.innerHTML=games.map(g=>`
    <div class="game">
      <input type="checkbox" class="deleteCheck" value="${g.id}">
      <div>
        <div class="time">${fmtDate(g.date)}</div>
        <div class="main">${g.winner} beat ${g.winner===g.player1?g.player2:g.player1}</div>
        <div class="meta">${g.end_condition||""}</div>
      </div>
    </div>
  `).join("");
}

function renderAll(){
  renderStandings();
  renderHistory();
  const p1=document.getElementById("player1");
  const p2=document.getElementById("player2");
  p1.innerHTML=players.map(p=>`<option>${p}</option>`).join("");
  p2.innerHTML=players.map(p=>`<option>${p}</option>`).join("");
}

async function logWin(which){
  const p1=document.getElementById("player1").value;
  const p2=document.getElementById("player2").value;
  if(!p1||!p2||p1===p2)return setStatus("Select 2 players","error");

  const last=games[0];
  if(last){
    const diff=(Date.now()-new Date(last.date))/1000;
    if(diff<DUP_GUARD_SECONDS)return setStatus("Duplicate prevented","error");
  }

  const grouping=document.getElementById("grouping").value;
  const end=document.getElementById("endCondition").value;

  await sb.from("games").insert({
    player1:p1,
    player2:p2,
    winner:which===1?p1:p2,
    p1_group:grouping||null,
    p2_group:null,
    end_condition:end||null,
    date:new Date().toISOString()
  });

  setStatus("Game logged");
  loadData();
}

async function deleteLast(){
  if(!games.length)return;
  lastDeleted=games[0];
  await sb.from("games").delete().eq("id",lastDeleted.id);
  setStatus("Deleted last game");
  loadData();
}

async function undo(){
  if(!lastDeleted)return;
  await sb.from("games").insert(lastDeleted);
  lastDeleted=null;
  setStatus("Undo successful");
  loadData();
}

async function deleteSelected(){
  const checks=document.querySelectorAll(".deleteCheck:checked");
  if(!checks.length)return setStatus("No games selected","error");
  const ids=[...checks].map(c=>c.value);
  await sb.from("games").delete().in("id",ids);
  setStatus(ids.length+" game(s) deleted");
  loadData();
}

function exportCSV(){
  if(!games.length)return;
  const headers=["player1","player2","winner","date"];
  let csv=headers.join(",")+"\n";
  games.slice().reverse().forEach(g=>{
    csv+=headers.map(h=>g[h]).join(",")+"\n";
  });
  const blob=new Blob([csv],{type:"text/csv"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="pool_log.csv";a.click();
  URL.revokeObjectURL(url);
}

document.getElementById("p1WinBtn").onclick=()=>logWin(1);
document.getElementById("p2WinBtn").onclick=()=>logWin(2);
document.getElementById("deleteLastBtn").onclick=deleteLast;
document.getElementById("undoBtn").onclick=undo;
document.getElementById("deleteSelectedBtn").onclick=deleteSelected;
document.getElementById("csvBtn").onclick=exportCSV;

document.getElementById("badge").textContent="v"+VERSION;

loadData();

})();
</script>
</body>
</html>

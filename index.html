<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>House Pool Log</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body { font-family: system-ui, sans-serif; padding:16px; max-width:650px; margin:auto; }
h2 { margin-top:20px; }
button { width:100%; padding:12px; font-size:16px; margin-top:8px; }
select,input { width:100%; padding:8px; font-size:15px; margin-top:6px; }
.row { margin-bottom:20px; }
.box { background:#f4f4f4; padding:12px; border-radius:6px; margin-bottom:12px; }
.stat-line { margin-bottom:4px; }
.leader { font-weight:bold; color:#0a7d2c; }
.small { font-size:13px; color:#555; }
.version { font-size:12px; color:#777; margin-bottom:10px; }
.status { margin-top:10px; font-weight:bold; }
.success { color:#0a7d2c; }
.error { color:#b00020; }
</style>
</head>
<body>

<h1>🎱 House Pool Log</h1>
<div class="version">Version 2.2.0</div>

<div id="status" class="status"></div>

<div class="row box">
  <h2>🏆 Overall Standings</h2>
  <div id="overall"></div>
</div>

<div class="row">
  <h2>Add Player</h2>
  <input id="newPlayer" placeholder="Player name"/>
  <button id="addPlayerBtn">Add Player</button>
</div>

<div class="row">
  <h2>At the Table</h2>
  <select id="player1"></select>
  <select id="player2"></select>

  <select id="grouping">
    <option value="">(Optional) Group</option>
    <option value="Solids">Solids</option>
    <option value="Stripes">Stripes</option>
  </select>

  <select id="endCondition">
    <option value="">(Optional) End Condition</option>
    <option>Clean win</option>
    <option>Opponent scratched on 8</option>
    <option>Opponent sank 8 early</option>
    <option>Opponent missed 8</option>
  </select>

  <button id="p1WinBtn">Player 1 Won</button>
  <button id="p2WinBtn">Player 2 Won</button>
</div>

<script>
(() => {
"use strict";

const VERSION = "2.2.0";

const SUPABASE_URL = "https://wybycecwkvrukcfoqgpa.supabase.co";
const SUPABASE_KEY = "sb_publishable_nNpJJg1ZBcQSjbX1HhPeKg_5KeR8ngb";

console.log("House Pool Log v" + VERSION);

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let players = [], games = [];

function setStatus(msg, type="success"){
  const el = document.getElementById("status");
  el.className = "status " + (type === "error" ? "error" : "success");
  el.innerText = msg;
  setTimeout(()=> el.innerText = "", 4000);
}

async function loadData(){
  const { data: playerData, error: playerError } =
    await sb.from("players").select("name").order("name");

  if (playerError) {
    console.error(playerError);
    setStatus("Error loading players", "error");
  }

  players = playerData?.map(p=>p.name) || [];

  const { data: gameData } =
    await sb.from("games").select("*").order("date",{ascending:true});

  games = gameData || [];

  render();
}

async function addPlayer(){
  const name = document.getElementById("newPlayer").value.trim();
  if(!name) return;

  const { error } = await sb.from("players").insert({ name });

  if(error){
    console.error(error);
    setStatus("Error adding player", "error");
    return;
  }

  setStatus("Player added!");
  document.getElementById("newPlayer").value = "";
  loadData();
}

async function logWin(which){
  const p1 = document.getElementById("player1").value;
  const p2 = document.getElementById("player2").value;

  if(!p1 || !p2 || p1===p2){
    setStatus("Select two different players", "error");
    return;
  }

  const grouping = document.getElementById("grouping").value;
  const endCondition = document.getElementById("endCondition").value;

  const payload = {
    player1: p1,
    player2: p2,
    winner: which===1 ? p1 : p2,
    p1_group: grouping || null,
    p2_group: grouping==="Solids"?"Stripes":
              grouping==="Stripes"?"Solids":null,
    end_condition: endCondition || null,
    date: new Date().toISOString()
  };

  const { error } = await sb.from("games").insert(payload);

  if(error){
    console.error("Insert error:", error);
    setStatus("Game failed to log", "error");
    return;
  }

  setStatus("Game logged successfully!");
  document.getElementById("grouping").value="";
  document.getElementById("endCondition").value="";
  loadData();
}

function render(){
  const stats = {};

  games.forEach(g=>{
    [g.player1,g.player2].forEach(p=>{
      if(!stats[p]) stats[p]={w:0,l:0};
    });

    const winner=g.winner;
    const loser=winner===g.player1?g.player2:g.player1;

    stats[winner].w++;
    stats[loser].l++;
  });

  let html="";
  Object.entries(stats).forEach(([p,s])=>{
    html+=`<div>${p}: ${s.w}-${s.l}</div>`;
  });

  document.getElementById("overall").innerHTML=html;

  refreshDropdowns();
}

function refreshDropdowns(){
  ["player1","player2"].forEach(id=>{
    const sel=document.getElementById(id);
    const current=sel.value;
    sel.innerHTML="<option value=''>Select player</option>";
    players.forEach(p=>sel.innerHTML+=`<option ${p===current?'selected':''}>${p}</option>`);
  });
}

document.getElementById("addPlayerBtn").onclick=addPlayer;
document.getElementById("p1WinBtn").onclick=()=>logWin(1);
document.getElementById("p2WinBtn").onclick=()=>logWin(2);

loadData();
})();
</script>
</body>
</html>

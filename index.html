<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>House Pool Log</title>

  <!-- Supabase v2 (CDN) -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <!-- QR Code -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 16px;
      max-width: 500px;
      margin: auto;
    }
    h2 { margin-top: 24px; }
    button {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      margin-top: 8px;
    }
    button:disabled { opacity: 0.4; }
    select, input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin-top: 6px;
    }
    .row { margin-bottom: 12px; }
    .win-btn { font-weight: bold; }
    .tally {
      background: #f4f4f4;
      padding: 12px;
      border-radius: 6px;
    }
    .date-label { font-size: 15px; color: #555; }
    .past-day {
      border-bottom: 1px solid #ddd;
      padding-bottom: 8px;
      margin-bottom: 8px;
    }
    .admin-banner {
      background: #222;
      color: #fff;
      padding: 6px;
      text-align: center;
      display: none;
      font-size: 13px;
    }
    .qr-box {
      text-align: center;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px dashed #ccc;
    }
    .qr-note {
      font-size: 14px;
      color: #555;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<div id="adminBanner" class="admin-banner">ADMIN MODE</div>

<h1>🎱 House Pool Log</h1>

<div class="row">
  <h2>Add Player</h2>
  <input id="newPlayer" placeholder="Player name" />
  <button id="addPlayerBtn">Add Player</button>
</div>

<div class="row">
  <h2>At the Table</h2>
  <select id="player1"></select>
  <select id="player2"></select>
</div>

<div class="row">
  <h2>Log Win</h2>
  <button class="win-btn" id="p1WinBtn" disabled>Player 1 Won</button>
  <button class="win-btn" id="p2WinBtn" disabled>Player 2 Won</button>

  <select id="endCondition">
    <option value="">(Optional) End Condition</option>
    <option>Clean win</option>
    <option>Opponent scratched on 8</option>
    <option>Opponent sank 8 early</option>
    <option>Opponent missed 8</option>
  </select>

  <button id="undoBtn">Undo Last Game</button>
</div>

<div class="row">
  <h2>Today</h2>
  <div class="date-label" id="todayLabel"></div>
  <div class="tally" id="tally"></div>
</div>

<div class="row">
  <h2>Past Days</h2>
  <div id="pastDays"></div>
</div>

<div class="qr-box">
  <h2>Scan to Log a Game</h2>
  <div id="qrcode"></div>
  <div class="qr-note">Open on your phone to log games</div>
</div>

<script>
(() => {
  "use strict";

  const APP_URL = "https://pr3am0h.github.io/house-pool-log/";
  const SUPABASE_URL = "https://wybycecwkvrukcfoqgpa.supabase.co";
  const SUPABASE_KEY = "YOUR_ANON_KEY";

  if (!window.supabase?.createClient) {
    alert("Supabase failed to load.");
    return;
  }

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const el = {
    adminBanner: document.getElementById("adminBanner"),
    newPlayer: document.getElementById("newPlayer"),
    addPlayerBtn: document.getElementById("addPlayerBtn"),
    player1: document.getElementById("player1"),
    player2: document.getElementById("player2"),
    p1WinBtn: document.getElementById("p1WinBtn"),
    p2WinBtn: document.getElementById("p2WinBtn"),
    endCondition: document.getElementById("endCondition"),
    undoBtn: document.getElementById("undoBtn"),
    todayLabel: document.getElementById("todayLabel"),
    tally: document.getElementById("tally"),
    pastDays: document.getElementById("pastDays"),
    qrcode: document.getElementById("qrcode"),
  };

  const today = new Date().toISOString().slice(0, 10);
  el.todayLabel.textContent = new Date().toLocaleDateString();

  let players = [];
  let games = [];
  let adminMode = false;

  function showError(prefix, error) {
    console.error(prefix, error?.message || error, error?.details || "", error?.hint || "");
  }

  async function loadData() {
    const p = await sb.from("players").select("name").order("name");
    if (p.error) showError("Load players:", p.error);
    players = (p.data || []).map(x => x.name);

    const g = await sb.from("games")
      .select("*")
      .order("date", { ascending: false, nullsLast: true })
      .order("created_at", { ascending: false });

    if (g.error) showError("Load games:", g.error);
    games = g.data || [];

    refreshUI();
    refreshAll();
  }

  async function addPlayer() {
    const name = el.newPlayer.value.trim();
    if (!name || players.includes(name)) return;

    const res = await sb.from("players").insert({ name });
    if (res.error) return showError("Add player:", res.error);

    el.newPlayer.value = "";
    loadData();
  }

  async function logWin(which) {
    const p1 = el.player1.value;
    const p2 = el.player2.value;
    if (!p1 || !p2 || p1 === p2) return;

    const winner = which === 1 ? p1 : p2;

    const res = await sb.from("games")
      .insert({
        player1: p1,
        player2: p2,
        winner,
        date: new Date().toISOString()
      })
      .select()
      .single();

    if (res.error) return showError("Log game:", res.error);

    el.endCondition.value = "";
    loadData();
  }

  async function undoLastGame() {
    if (!games.length) return;
    const last = games[0];
    const res = await sb.from("games").delete().eq("id", last.id);
    if (res.error) showError("Undo:", res.error);
    loadData();
  }

  function refreshUI() {
    [el.player1, el.player2].forEach(sel => {
      sel.innerHTML = "<option value=''>Select player</option>";
      players.forEach(p => sel.add(new Option(p, p)));
    });
    updateState();
  }

  function refreshTally() {
    el.tally.innerHTML = "";
    const map = {};
    games.filter(g => g.date?.startsWith(today)).forEach(g => {
      map[g.winner] = (map[g.winner] || 0) + 1;
    });
    Object.entries(map).forEach(([n,c]) => {
      el.tally.innerHTML += `<div>${n}: ${c}</div>`;
    });
  }

  function refreshPastDays() {
    el.pastDays.innerHTML = "";
  }

  function refreshAll() {
    refreshTally();
    refreshPastDays();
  }

  function updateState() {
    const ok = el.player1.value && el.player2.value && el.player1.value !== el.player2.value;
    el.p1WinBtn.disabled = !ok;
    el.p2WinBtn.disabled = !ok;
  }

  el.addPlayerBtn.onclick = addPlayer;
  el.p1WinBtn.onclick = () => logWin(1);
  el.p2WinBtn.onclick = () => logWin(2);
  el.undoBtn.onclick = undoLastGame;
  el.player1.onchange = updateState;
  el.player2.onchange = updateState;

  new QRCode(el.qrcode, { text: APP_URL, width: 180, height: 180 });

  loadData();
})();
</script>

</body>
</html>

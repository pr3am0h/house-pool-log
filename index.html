<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pool Log Pro</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
:root{
--bg:#0b0b10;
--card:#14141c;
--text:#e5e7eb;
--muted:#9ca3af;
--accent:#6f2dbd;
--line:#2a2a35;
--radius:14px;
}

body{
font-family:system-ui;
background:var(--bg);
color:var(--text);
padding:14px;
max-width:900px;
margin:auto;
}

.card{
background:var(--card);
padding:14px;
border-radius:var(--radius);
margin-bottom:12px;
}

.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}

button{
padding:14px;
border:none;
border-radius:10px;
background:var(--accent);
color:white;
font-size:15px;
font-weight:bold;
}

select,input{
padding:12px;
border-radius:10px;
border:none;
font-size:15px;
}

.small{font-size:12px;color:var(--muted)}
.leader{
display:flex;
justify-content:space-between;
padding:10px;
border-bottom:1px solid var(--line);
}

.tooltip{
font-size:11px;
color:var(--muted);
margin-top:4px;
}
</style>
</head>

<body>

<h2>🎱 Pool Log</h2>

<div class="card">

<div class="row">
<select id="player1"></select>
<select id="player2"></select>
</div>

<div class="row">
<button id="p1WinBtn"></button>
<button id="p2WinBtn"></button>
</div>

<div class="row">
<select id="winType">
<option value="">Win Type</option>
<option>8 Ball</option>
<option>Opponent Scratch</option>
<option>Opponent Early 8</option>
<option>Scratch on 8</option>
</select>
</div>

<div class="row">
<button id="rematchBtn">🔁 Rematch</button>
<button id="modeBtn">🏠 House Mode</button>
<button id="kingModeBtn">👑 King Mode: OFF</button>
</div>

<div class="tooltip">Rematch swaps players quickly for next game</div>
<div class="tooltip">Mode changes rule enforcement</div>
<div class="tooltip">King Mode keeps winner on table</div>

<div id="h2h" class="small"></div>

</div>

<div class="card" id="standings"></div>
<div class="card" id="king"></div>
<div class="card" id="playerStats"></div>

<div class="card" id="history"></div>

<script>

const sb=supabase.createClient(
"https://wybycecwkvrukcfoqgpa.supabase.co",
"sb_publishable_nNpJJg1ZBcQSjbX1HhPeKg_5KeR8ngb"
)

let players=[],games=[]
let mode="house"
let kingMode=false

async function loadData(){
const {data:p}=await sb.from("players").select("name")
players=p.map(x=>x.name)

const {data:g}=await sb.from("games").select("*").order("date",{ascending:false})
games=g||[]

renderAll()
}

function renderPlayers(){
player1.innerHTML=players.map(p=>`<option>${p}</option>`).join("")
player2.innerHTML=players.map(p=>`<option>${p}</option>`).join("")
updateButtons()
}

function updateButtons(){
p1WinBtn.textContent=player1.value+" Won"
p2WinBtn.textContent=player2.value+" Won"
renderH2H()
}

player1.onchange=updateButtons
player2.onchange=updateButtons

function renderH2H(){
let p1=player1.value,p2=player2.value
let w1=0,w2=0

games.forEach(g=>{
if((g.player1===p1&&g.player2===p2)||(g.player1===p2&&g.player2===p1)){
if(g.winner===p1)w1++
if(g.winner===p2)w2++
}
})

h2h.innerHTML=`${p1} leads ${p2} ${w1}-${w2}`
}

async function logWin(which){

let p1=player1.value,p2=player2.value
let winner=which===1?p1:p2
let loser=which===1?p2:p1
let type=winType.value

// APA enforcement
if(mode==="apa"){
if(!type){alert("Select win type");return}

if(type==="Scratch on 8"){
winner=loser
}
if(type==="Opponent Early 8"){
winner=which===1?p1:p2
}
}

await sb.from("games").insert({
player1:p1,
player2:p2,
winner,
win_type:type
})

if(kingMode){
player1.value=winner
}

loadData()
}

function computeStats(){
let stats={},elo={}
games.slice().reverse().forEach(g=>{
[g.player1,g.player2].forEach(p=>{
if(!stats[p])stats[p]={w:0,l:0}
if(!elo[p])elo[p]=1000
})
let w=g.winner
let l=w===g.player1?g.player2:g.player1
stats[w].w++
stats[l].l++

let exp=1/(1+Math.pow(10,(elo[l]-elo[w])/400))
elo[w]+=20*(1-exp)
elo[l]+=20*(0-(1-exp))
})
return {stats,elo}
}

function renderStandings(){
let {stats,elo}=computeStats()

standings.innerHTML=Object.entries(stats)
.sort((a,b)=>elo[b[0]]-elo[a[0]])
.map(([p,s],i)=>`
<div class="leader">
<div>${i+1}. ${p} (${s.w}-${s.l})</div>
<div>${Math.round(elo[p])}</div>
</div>
`).join("")
}

function renderKing(){
if(!games.length){king.innerHTML="";return}
king.innerHTML=`👑 Current: ${games[0].winner}`
}

function renderPlayerStats(){
let {stats}=computeStats()
playerStats.innerHTML=Object.entries(stats).map(([p,s])=>`
<div class="leader">${p} • ${s.w}-${s.l}</div>
`).join("")
}

function renderHistory(){
history.innerHTML=games.map(g=>`
<div class="small">${g.winner} won (${g.win_type||"quick win"})</div>
`).join("")
}

modeBtn.onclick=()=>{
mode = mode==="house"?"apa":"house"
modeBtn.textContent = mode==="house"?"🏠 House Mode":"🎱 APA Mode"
}

kingModeBtn.onclick=()=>{
kingMode=!kingMode
kingModeBtn.textContent=`👑 King Mode: ${kingMode?"ON":"OFF"}`
}

rematchBtn.onclick=()=>{
let t=player1.value
player1.value=player2.value
player2.value=t
updateButtons()
}

p1WinBtn.onclick=()=>logWin(1)
p2WinBtn.onclick=()=>logWin(2)

function renderAll(){
renderPlayers()
renderStandings()
renderKing()
renderPlayerStats()
renderHistory()
updateButtons()
}

loadData()

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Pool Log</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>

:root{
--bg:#0b0b10;
--card:#14141c;
--muted:#9ca3af;
--text:#e5e7eb;
--line:#2a2a35;

--accent:#6f2dbd;
--accent-hover:#5a23a3;

--shadow:0 6px 25px rgba(0,0,0,0.4);
--radius:14px;
}

body{
font-family:system-ui;
background:
radial-gradient(circle at top left, rgba(111,45,189,0.15), transparent 40%),
radial-gradient(circle at bottom right, rgba(111,45,189,0.1), transparent 50%),
var(--bg);
padding:20px;
max-width:1100px;
margin:auto;
color:var(--text);
}

.layout{
display:grid;
grid-template-columns:2fr 1fr;
gap:16px;
}

@media(max-width:900px){
.layout{grid-template-columns:1fr}
}

.grid{display:grid;gap:14px;}

.card{
background:var(--card);
border-radius:var(--radius);
padding:16px;
box-shadow:var(--shadow);
border:1px solid rgba(255,255,255,0.04);
}

button{
padding:10px 12px;
border:none;
border-radius:10px;
cursor:pointer;
background:var(--accent);
color:white;
font-weight:600;
}

button:hover{
background:var(--accent-hover);
}

.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}

.btnrow{display:flex;gap:10px;margin-top:10px}

.player-row{
display:flex;
justify-content:space-between;
padding:6px 0;
border-bottom:1px solid var(--line);
}

.pill{
font-size:12px;
padding:3px 8px;
border-radius:999px;
background:rgba(111,45,189,0.2);
margin-left:6px;
}

.history{
max-height:280px;
overflow-y:auto;
}

.standings-table{
width:100%;
border-collapse:collapse;
}

.standings-table th,
.standings-table td{
padding:8px 6px;
}

.standings-table tr{
border-bottom:1px solid var(--line);
}

.player-click{cursor:pointer;color:#c4b5fd}

.king{
text-align:center;
padding:12px;
background:rgba(111,45,189,0.15);
border-radius:10px;
margin-bottom:10px;
}

</style>
</head>

<body>

<h1>🎱 House Pool Log <span id="badge"></span></h1>

<div class="layout">

<div class="grid">

<div class="card">
<h2>📝 Log Game</h2>

<div class="row">
<select id="player1"></select>
<select id="player2"></select>
</div>

<div class="row">
<select id="gameType">
<option>8 Ball</option>
<option>9 Ball</option>
<option>Other</option>
</select>
</div>

<div class="btnrow">
<button id="p1WinBtn"></button>
<button id="p2WinBtn"></button>
</div>

<div class="btnrow">
<button id="rematchBtn">🔁 Rematch</button>
</div>
</div>

<div class="card">
<h2>👥 Players</h2>

<div class="row">
<input id="newPlayer" placeholder="Enter player name">
<button id="addPlayerBtn">Add Player</button>
</div>

<div id="playerList"></div>
</div>

<div class="card">
<details>
<summary>📜 Rules</summary>

<p><b>House Rules (8 Ball)</b></p>
<ul>
<li>Call pocket on 8</li>
<li>Scratch on 8 = loss</li>
<li>No slop shots</li>
</ul>

<p><b>APA Notes</b></p>
<ul>
<li>Ball-in-hand on scratch</li>
<li>8 must be called</li>
</ul>

</details>
</div>

<div class="card">
<details open>
<summary>🕙 Game History</summary>
<div id="history" class="history"></div>
<button id="deleteLastBtn">Undo Last Game</button>
</details>
</div>

</div>

<div class="grid">

<div class="card">
<h2>👑 King of the Table</h2>
<div id="king"></div>
</div>

<div class="card">
<h2>🏆 Standings</h2>
<div id="standings"></div>
</div>

</div>

</div>

<script>

const VERSION="3.5.0"

const SUPABASE_URL="https://wybycecwkvrukcfoqgpa.supabase.co"
const SUPABASE_KEY="sb_publishable_nNpJJg1ZBcQSjbX1HhPeKg_5KeR8ngb"

const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY)

const K=20

let players=[]
let games=[]

document.getElementById("badge").textContent="v"+VERSION

async function loadData(){

const {data:p}=await sb.from("players").select("name").order("name")
players=p.map(x=>x.name)

const {data:g}=await sb.from("games").select("*").order("date",{ascending:false})
games=g

renderAll()

}

function computeStats(){

const stats={},elo={},streak={},maxStreak={}

games.slice().reverse().forEach(g=>{

[g.player1,g.player2].forEach(p=>{
if(!stats[p])stats[p]={w:0,l:0}
if(!elo[p])elo[p]=1000
if(!streak[p])streak[p]=0
if(!maxStreak[p])maxStreak[p]=0
})

const winner=g.winner
const loser=winner===g.player1?g.player2:g.player1

stats[winner].w++
stats[loser].l++

streak[winner]++
streak[loser]=0

maxStreak[winner]=Math.max(maxStreak[winner],streak[winner])

const exp=1/(1+Math.pow(10,(elo[loser]-elo[winner])/400))

elo[winner]+=K*(1-exp)
elo[loser]+=K*(0-(1-exp))

})

return{stats,elo,streak,maxStreak}

}

function renderKing(){

if(!games.length){
document.getElementById("king").innerHTML="No games yet"
return
}

const lastWinner=games[0].winner

const {maxStreak}=computeStats()

let bestPlayer=Object.entries(maxStreak).sort((a,b)=>b[1]-a[1])[0]

document.getElementById("king").innerHTML=`
<div class="king">
👑 <b>${lastWinner}</b><br>
Current King<br><br>
🔥 Best Streak: ${bestPlayer[0]} (${bestPlayer[1]})
</div>
`

}

function renderStandings(){

const {stats,elo,streak}=computeStats()

const list=Object.entries(stats).sort((a,b)=>elo[b[0]]-elo[a[0]])

document.getElementById("standings").innerHTML=`

<table class="standings-table">
<tr>
<th>#</th>
<th>Player</th>
<th>Record</th>
<th>ELO</th>
<th>Win %</th>
</tr>

${list.map(([p,s],i)=>{

const games=s.w+s.l
const pct=((s.w/games)*100).toFixed(1)
const st=streak[p]>1?` 🔥 ${streak[p]}`:""

return`
<tr>
<td>${i+1}</td>
<td class="player-click" onclick="showHead('${p}')"><b>${p}</b>${st}</td>
<td>${s.w}-${s.l}</td>
<td>${Math.round(elo[p])}</td>
<td>${pct}%</td>
</tr>
`

}).join("")}

</table>
`

}

function showHead(p){

let r={}

games.forEach(g=>{
if(g.player1===p||g.player2===p){
let o=g.player1===p?g.player2:g.player1
if(!r[o])r[o]={w:0,l:0}
if(g.winner===p)r[o].w++
else r[o].l++
}
})

let txt=`${p} head-to-head:\n\n`
Object.entries(r).forEach(([o,v])=>{
txt+=`${p} vs ${o}: ${v.w}-${v.l}\n`
})

alert(txt)

}

function renderHistory(){

document.getElementById("history").innerHTML=
games.map(g=>`
<div>
<div class="muted">${new Date(g.date).toLocaleString()}</div>
<b>${g.winner}</b> beat ${g.winner===g.player1?g.player2:g.player1}
</div>
`).join("")

}

function renderPlayers(){

const p1=document.getElementById("player1")
const p2=document.getElementById("player2")

p1.innerHTML=players.map(p=>`<option>${p}</option>`).join("")
p2.innerHTML=players.map(p=>`<option>${p}</option>`).join("")

updateButtons()

document.getElementById("playerList").innerHTML=
players.map(p=>`
<div class="player-row">
<div>${p}</div>
<div>
<button onclick="editPlayer('${p}')">Edit</button>
<button onclick="deletePlayer('${p}')">Delete</button>
</div>
</div>`).join("")

}

function renderAll(){
renderPlayers()
renderStandings()
renderHistory()
renderKing()
}

function updateButtons(){
const p1=document.getElementById("player1").value||"Player 1"
const p2=document.getElementById("player2").value||"Player 2"
document.getElementById("p1WinBtn").textContent=p1+" Won"
document.getElementById("p2WinBtn").textContent=p2+" Won"
}

async function logWin(which){

const p1=document.getElementById("player1").value
const p2=document.getElementById("player2").value
const gameType=document.getElementById("gameType").value

if(p1===p2)return alert("Players must be different.")

await sb.from("games").insert({
player1:p1,
player2:p2,
winner:which===1?p1:p2,
game_type:gameType,
date:new Date().toISOString()
})

loadData()

}

async function deleteLast(){
if(!games.length)return
await sb.from("games").delete().eq("id",games[0].id)
loadData()
}

function quickRematch(){
let p1=document.getElementById("player1")
let p2=document.getElementById("player2")
let t=p1.value
p1.value=p2.value
p2.value=t
updateButtons()
}

document.getElementById("p1WinBtn").onclick=()=>logWin(1)
document.getElementById("p2WinBtn").onclick=()=>logWin(2)
document.getElementById("rematchBtn").onclick=quickRematch
document.getElementById("addPlayerBtn").onclick=addPlayer
document.getElementById("deleteLastBtn").onclick=deleteLast

async function addPlayer(){
let n=document.getElementById("newPlayer").value.trim()
if(!n||players.includes(n))return
await sb.from("players").insert({name:n})
document.getElementById("newPlayer").value=""
loadData()
}

async function editPlayer(oldName){
let newName=prompt("Edit player name",oldName)
if(!newName)return
await sb.from("players").update({name:newName}).eq("name",oldName)
await sb.from("games").update({player1:newName}).eq("player1",oldName)
await sb.from("games").update({player2:newName}).eq("player2",oldName)
await sb.from("games").update({winner:newName}).eq("winner",oldName)
loadData()
}

async function deletePlayer(name){
let used=games.some(g=>g.player1===name||g.player2===name)
if(used)return alert("Cannot delete player with logged games.")
if(!confirm("Delete "+name+" ?"))return
await sb.from("players").delete().eq("name",name)
loadData()
}

loadData()

</script>

</body>
</html>

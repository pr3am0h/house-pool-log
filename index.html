<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>House Pool Log</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body { font-family: system-ui, sans-serif; padding:16px; max-width:500px; margin:auto; }
h2 { margin-top:24px; }
button { width:100%; padding:14px; font-size:18px; margin-top:8px; }
button:disabled { opacity:0.4; }
select,input { width:100%; padding:10px; font-size:16px; margin-top:6px; }
.row { margin-bottom:12px; }
.win-btn { font-weight:bold; }
.tally { background:#f4f4f4; padding:12px; border-radius:6px; }
.past-day { border-bottom:1px solid #ddd; margin-bottom:8px; padding-bottom:6px; }
.admin-banner { background:#222; color:#fff; padding:6px; text-align:center; display:none; font-size:13px; }
.delete-btn { color:red; cursor:pointer; margin-left:6px; }
</style>
</head>

<body>

<div id="adminBanner" class="admin-banner">ADMIN MODE</div>

<h1>🎱 House Pool Log</h1>

<div class="row">
<h2>Add Player</h2>
<input id="newPlayer" placeholder="Player name"/>
<button id="addPlayerBtn">Add Player</button>
</div>

<div class="row">
<h2>At the Table</h2>
<select id="player1"></select>
<select id="player2"></select>

<select id="grouping">
<option value="">(Optional) Player 1 Group</option>
<option value="Solids">Solids</option>
<option value="Stripes">Stripes</option>
</select>
</div>

<div class="row">
<h2>Log Win</h2>
<button id="p1WinBtn" disabled>Player 1 Won</button>
<button id="p2WinBtn" disabled>Player 2 Won</button>

<select id="endCondition">
<option value="">(Optional) End Condition</option>
<option>Clean win</option>
<option>Opponent scratched on 8</option>
<option>Opponent sank 8 early</option>
<option>Opponent missed 8</option>
</select>

<button id="undoBtn">Undo Last Game</button>
</div>

<div class="row">
<h2>Today</h2>
<div id="todayLabel"></div>
<div id="tally" class="tally"></div>
</div>

<div class="row">
<h2>Past Days</h2>
<div id="pastDays"></div>
</div>

<script>
(() => {
"use strict";

const SUPABASE_URL = "https://wybycecwkvrukcfoqgpa.supabase.co";
const SUPABASE_KEY = "sb_publishable_nNpJJg1ZBcQSjbX1HhPeKg_5KeR8ngb";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const el = {
adminBanner: document.getElementById("adminBanner"),
newPlayer: document.getElementById("newPlayer"),
addPlayerBtn: document.getElementById("addPlayerBtn"),
player1: document.getElementById("player1"),
player2: document.getElementById("player2"),
grouping: document.getElementById("grouping"),
p1WinBtn: document.getElementById("p1WinBtn"),
p2WinBtn: document.getElementById("p2WinBtn"),
endCondition: document.getElementById("endCondition"),
undoBtn: document.getElementById("undoBtn"),
todayLabel: document.getElementById("todayLabel"),
tally: document.getElementById("tally"),
pastDays: document.getElementById("pastDays")
};

const todayKey = new Date().toISOString().slice(0,10);
el.todayLabel.textContent = new Date().toLocaleDateString();

let players=[], games=[], adminMode=false;
const dayKey = g => (g.date || g.created_at || "").slice(0,10);

async function loadData(){
players = (await sb.from("players").select("name").order("name")).data || [];
players = players.map(p=>p.name);

games = (await sb.from("games").select("*").order("date",{ascending:false})).data || [];
refresh();
}

async function addPlayer(){
const name=el.newPlayer.value.trim();
if(!name) return;
await sb.from("players").insert({name});
el.newPlayer.value="";
loadData();
}

async function logWin(which){
const p1=el.player1.value, p2=el.player2.value;
if(!p1||!p2||p1===p2) return;

let p1_group = el.grouping.value || null;
let p2_group = p1_group === "Solids" ? "Stripes" :
               p1_group === "Stripes" ? "Solids" : null;

await sb.from("games").insert({
player1:p1,
player2:p2,
winner: which===1?p1:p2,
p1_group,
p2_group,
date:new Date().toISOString()
});

el.grouping.value="";
el.endCondition.value="";
loadData();
}

async function undoLastGame(){
const todayGames = games.filter(g=>dayKey(g)===todayKey);
if(!todayGames.length) return;
await sb.from("games").delete().eq("id",todayGames[0].id);
loadData();
}

async function deleteGame(id){
if(!adminMode) return;
if(!confirm("Delete this game?")) return;
await sb.from("games").delete().eq("id",id);
loadData();
}

function refresh(){
refreshPlayers();
refreshTally();
refreshPastDays();
}

function refreshPlayers(){
[el.player1,el.player2].forEach(sel=>{
sel.innerHTML="<option value=''>Select player</option>";
players.forEach(p=>sel.add(new Option(p,p)));
});
updateState();
}

function refreshTally(){
el.tally.innerHTML="";
const map={};
games.filter(g=>dayKey(g)===todayKey).forEach(g=>{
map[g.winner]=(map[g.winner]||0)+1;
});
Object.entries(map).forEach(([n,c])=>{
el.tally.innerHTML+=`<div>${n}: ${c}</div>`;
});
}

function refreshPastDays(){
el.pastDays.innerHTML="";
const past = games.filter(g=>dayKey(g)!==todayKey);
const byDate={};

past.forEach(g=>{
(byDate[dayKey(g)] ||= []).push(g);
});

Object.keys(byDate).sort().reverse().forEach(d=>{
const h=document.createElement("div");
h.className="past-day";
h.textContent=d;
el.pastDays.appendChild(h);

byDate[d].forEach(g=>{
const row=document.createElement("div");
row.textContent =
`${g.winner} (${g.p1_group||"?"}) beat ${g.winner===g.player1?g.player2:g.player1}`;
if(adminMode){
const del=document.createElement("span");
del.textContent=" 🗑";
del.className="delete-btn";
del.onclick=()=>deleteGame(g.id);
row.appendChild(del);
}
el.pastDays.appendChild(row);
});
});
}

function updateState(){
const ok=el.player1.value&&el.player2.value&&el.player1.value!==el.player2.value;
el.p1WinBtn.disabled=!ok;
el.p2WinBtn.disabled=!ok;
}

document.addEventListener("keydown",e=>{
if(e.ctrlKey&&e.altKey&&e.key.toLowerCase()==="a"){
e.preventDefault();
adminMode=!adminMode;
el.adminBanner.style.display=adminMode?"block":"none";
refresh();
}
});

el.addPlayerBtn.onclick=addPlayer;
el.p1WinBtn.onclick=()=>logWin(1);
el.p2WinBtn.onclick=()=>logWin(2);
el.undoBtn.onclick=undoLastGame;
el.player1.onchange=updateState;
el.player2.onchange=updateState;

loadData();
})();
</script>

</body>
</html>

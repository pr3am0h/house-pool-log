<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pool Log Pro</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
:root{
--bg:#0b0b10;
--card:#14141c;
--text:#e5e7eb;
--muted:#9ca3af;
--accent:#6f2dbd;
--line:#2a2a35;
--radius:14px;
}

body{
font-family:system-ui;
background:var(--bg);
color:var(--text);
padding:14px;
max-width:900px;
margin:auto;
}

.card{
background:var(--card);
padding:14px;
border-radius:var(--radius);
margin-bottom:12px;
}

.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}

button{
padding:12px;
border:none;
border-radius:10px;
background:var(--accent);
color:white;
font-weight:bold;
cursor:pointer;
}

select,input{
padding:10px;
border-radius:10px;
border:none;
}

.small{font-size:12px;color:var(--muted)}

.leader{
display:flex;
justify-content:space-between;
padding:8px;
border-bottom:1px solid var(--line);
}

.stat{
background:#111;
padding:10px;
border-radius:10px;
margin-top:8px;
border:1px solid var(--line);
}

.tooltip{font-size:11px;color:var(--muted)}

details summary{
cursor:pointer;
font-weight:bold;
margin-bottom:6px;
}
</style>
</head>

<body>

<h2>🎱 Pool Log</h2>

<div class="card">

<div class="row">
<select id="player1"></select>
<select id="player2"></select>
</div>

<div class="row">
<button id="p1WinBtn"></button>
<button id="p2WinBtn"></button>
</div>

<div class="row">
<select id="winType">
<option value="">Win Type</option>
<option>8 Ball</option>
<option>Opponent Scratch</option>
<option>Opponent Early 8</option>
<option>Scratch on 8</option>
</select>
</div>

<div class="row">
<button id="rematchBtn">🔁 Rematch</button>
<button id="modeBtn">🏠 House Mode</button>
<button id="kingModeBtn">👑 King OFF</button>
</div>

<div class="tooltip">Rematch swaps players instantly</div>
<div class="tooltip">Mode enforces rules (APA requires win type)</div>
<div class="tooltip">King Mode keeps winner on table</div>

<div id="h2h" class="small"></div>

</div>

<div class="card">
<input id="newPlayer" placeholder="Player name">
<button id="addPlayerBtn">Add Player</button>
</div>

<div class="card" id="king"></div>
<div class="card" id="potn"></div>
<div class="card" id="standings"></div>
<div class="card" id="playerStats"></div>
<div class="card" id="h2hFull"></div>

<div class="card">
<div id="history"></div>
<button id="deleteLastBtn">Undo</button>
</div>

<div class="card" id="rules"></div>

<script>

const sb=supabase.createClient(
"https://wybycecwkvrukcfoqgpa.supabase.co",
"sb_publishable_nNpJJg1ZBcQSjbX1HhPeKg_5KeR8ngb"
)

let players=[],games=[]
let mode="house"
let kingMode=false
const K=20

async function injectManualGames(){
let date=new Date()
date.setDate(date.getDate()-((date.getDay()+4)%7)) // last Wednesday

let {data}=await sb.from("games")
.select("*")
.eq("player1","Kdub")
.eq("player2","Stuffy")
.eq("winner","Kdub")

if(data.length>=2)return

await sb.from("games").insert([
{player1:"Kdub",player2:"Stuffy",winner:"Kdub",date},
{player1:"Kdub",player2:"Stuffy",winner:"Kdub",date}
])
}

async function loadData(){

await injectManualGames()

const {data:p}=await sb.from("players").select("name").order("name")
players=p?.map(x=>x.name)||[]

const {data:g}=await sb.from("games").select("*").order("date",{ascending:false})
games=g||[]

renderAll()
}

function renderPlayers(){
player1.innerHTML=players.map(p=>`<option>${p}</option>`).join("")
player2.innerHTML=players.map(p=>`<option>${p}</option>`).join("")
updateButtons()
}

function updateButtons(){
p1WinBtn.textContent=(player1.value||"Player")+" Won"
p2WinBtn.textContent=(player2.value||"Player")+" Won"
renderH2H()
}

player1.onchange=updateButtons
player2.onchange=updateButtons

function renderH2H(){
let p1=player1.value,p2=player2.value
let w1=0,w2=0
games.forEach(g=>{
if((g.player1===p1&&g.player2===p2)||(g.player1===p2&&g.player2===p1)){
if(g.winner===p1)w1++
if(g.winner===p2)w2++
}
})
h2h.innerHTML=`${p1} leads ${p2} ${w1}-${w2}`
}

function renderH2HFull(){
let map={}
games.forEach(g=>{
let key=[g.player1,g.player2].sort().join("-")
if(!map[key])map[key]={p1:g.player1,p2:g.player2,w1:0,w2:0}

if(g.winner===map[key].p1)map[key].w1++
else map[key].w2++
})

h2hFull.innerHTML="<b>Head to Head</b><br>"+Object.values(map)
.sort((a,b)=>(b.w1+b.w2)-(a.w1+a.w2))
.map(m=>`${m.p1} ${m.w1}-${m.w2} ${m.p2}`)
.join("<br>")
}

async function logWin(which){
let p1=player1.value
let p2=player2.value
if(p1===p2)return

let winner=which===1?p1:p2
let loser=which===1?p2:p1
let type=winType.value

if(mode==="apa"){
if(!type){alert("Select win type");return}
if(type==="Scratch on 8") winner=loser
}

await sb.from("games").insert({player1:p1,player2:p2,winner,win_type:type})

if(kingMode){
player1.value=winner
}

loadData()
}

addPlayerBtn.onclick=async()=>{
let name=newPlayer.value.trim()
if(!name)return
await sb.from("players").insert({name})
newPlayer.value=""
loadData()
}

deleteLastBtn.onclick=async()=>{
if(!games.length)return
await sb.from("games").delete().eq("id",games[0].id)
loadData()
}

function computeStats(){
let stats={},elo={}
games.slice().reverse().forEach(g=>{
[g.player1,g.player2].forEach(p=>{
if(!stats[p])stats[p]={w:0,l:0,history:[]}
if(!elo[p])elo[p]=1000
})
let w=g.winner
let l=w===g.player1?g.player2:g.player1
stats[w].w++
stats[l].l++
stats[w].history.push(1)
stats[l].history.push(0)

let exp=1/(1+Math.pow(10,(elo[l]-elo[w])/400))
elo[w]+=K*(1-exp)
elo[l]+=K*(0-(1-exp))
})
return {stats,elo}
}

function renderStandings(){
let {stats,elo}=computeStats()
standings.innerHTML=Object.entries(stats)
.sort((a,b)=>elo[b[0]]-elo[a[0]])
.map(([p,s],i)=>`
<div class="leader">
<div>${i+1}. ${p} (${s.w}-${s.l})</div>
<div>${Math.round(elo[p])}</div>
</div>
`).join("")
}

function renderKing(){
if(!games.length){king.innerHTML="No games";return}

let best=0,cur=0,last=null
games.slice().reverse().forEach(g=>{
if(g.winner===last){cur++}else{cur=1;last=g.winner}
best=Math.max(best,cur)
})

king.innerHTML=`👑 Current: ${games[0].winner}<br>🔥 Streak: ${cur}<br>🏆 Best: ${best}`
}

function renderPlayerStats(){
let {stats,elo}=computeStats()
playerStats.innerHTML=Object.entries(stats).map(([p,s])=>{
let total=s.w+s.l
let pct=((s.w/total)*100||0).toFixed(1)
let last10=s.history.slice(-10)
return `
<div class="stat">
<b>${p}</b><br>
Win% ${pct}% | ELO ${Math.round(elo[p])}<br>
${last10.map(x=>x?"🟩":"⬛").join("")}
</div>`
}).join("")
}

function renderPOTN(){
let recent=games.slice(0,20)
let score={}
recent.forEach(g=>{
if(!score[g.winner])score[g.winner]=0
score[g.winner]++
})
let best=Object.entries(score).sort((a,b)=>b[1]-a[1])[0]
potn.innerHTML=best?`🏆 ${best[0]} (${best[1]} wins)`:""
}

function renderHistory(){
history.innerHTML=games.map(g=>`
<div class="small">${g.winner} beat ${g.winner===g.player1?g.player2:g.player1} (${g.win_type||"quick"})</div>
`).join("")
}

function renderRules(){
rules.innerHTML=`

<details open>
<summary>🏠 House Rules</summary>
<ul>
<li>Table is open after the break.</li>
<li>No call shots — slop counts.</li>
<li>First player to legally pocket the 8 ball wins.</li>
<li>Scratching on the 8 ball results in a loss.</li>
<li>Sinking the 8 ball early results in a loss.</li>
<li>Games are fast and casual.</li>
</ul>
</details>

<details>
<summary>🎱 APA Rules</summary>
<ul>
<li>Table is open after the break.</li>
<li>Players must call intended shots.</li>
<li>Must hit your group first.</li>
<li>Clear your group before attempting the 8.</li>
<li>Scratch on the 8 is a loss.</li>
<li>Early 8 is a loss.</li>
<li>Defensive shots are allowed.</li>
</ul>
</details>

`
}

function renderAll(){
renderPlayers()
renderStandings()
renderKing()
renderPlayerStats()
renderPOTN()
renderHistory()
renderRules()
renderH2HFull()
updateButtons()
}

modeBtn.onclick=()=>{
mode=mode==="house"?"apa":"house"
modeBtn.textContent=mode==="house"?"🏠 House Mode":"🎱 APA Mode"
}

kingModeBtn.onclick=()=>{
kingMode=!kingMode
kingModeBtn.textContent=`👑 King ${kingMode?"ON":"OFF"}`
}

rematchBtn.onclick=()=>{
let t=player1.value
player1.value=player2.value
player2.value=t
updateButtons()
}

p1WinBtn.onclick=()=>logWin(1)
p2WinBtn.onclick=()=>logWin(2)

loadData()

</script>

</body>
</html>

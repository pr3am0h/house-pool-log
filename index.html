<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>House Pool Log</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body { font-family: system-ui, sans-serif; padding:16px; max-width:650px; margin:auto; }
h2 { margin-top:20px; }
button { width:100%; padding:12px; font-size:16px; margin-top:8px; }
select,input { width:100%; padding:8px; font-size:15px; margin-top:6px; }
.row { margin-bottom:20px; }
.box { background:#f4f4f4; padding:12px; border-radius:6px; margin-bottom:12px; }
.stat-line { margin-bottom:4px; }
.leader { font-weight:bold; color:#0a7d2c; }
.small { font-size:13px; color:#555; }
</style>
</head>
<body>

<h1>🎱 House Pool Log</h1>

<div class="row box">
  <h2>🏆 Overall Standings</h2>
  <div id="overall"></div>
</div>

<div class="row box">
  <h2>🔥 Streaks</h2>
  <div id="streaks"></div>
</div>

<div class="row box">
  <h2>🤝 Head-to-Head</h2>
  <div id="h2h"></div>
</div>

<div class="row box">
  <h2>📊 Advanced Stats</h2>
  <div id="advanced"></div>
</div>

<div class="row box">
  <h2>🕙 Last 10 Games</h2>
  <div id="last10"></div>
</div>

<div class="row">
  <h2>Add Player</h2>
  <input id="newPlayer" placeholder="Player name"/>
  <button id="addPlayerBtn">Add Player</button>
</div>

<div class="row">
  <h2>At the Table</h2>
  <select id="player1"></select>
  <select id="player2"></select>

  <select id="grouping">
    <option value="">(Optional) Group</option>
    <option value="Solids">Solids</option>
    <option value="Stripes">Stripes</option>
  </select>

  <select id="endCondition">
    <option value="">(Optional) End Condition</option>
    <option>Clean win</option>
    <option>Opponent scratched on 8</option>
    <option>Opponent sank 8 early</option>
    <option>Opponent missed 8</option>
  </select>

  <button id="p1WinBtn">Player 1 Won</button>
  <button id="p2WinBtn">Player 2 Won</button>
</div>

<script>
(() => {
"use strict";

const SUPABASE_URL = "https://wybycecwkvrukcfoqgpa.supabase.co";
const SUPABASE_KEY = "sb_publishable_nNpJJg1ZBcQSjbX1HhPeKg_5KeR8ngb";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const K = 20;
let players = [], games = [];

async function loadData(){
  players = (await sb.from("players").select("name").order("name")).data?.map(p=>p.name) || [];
  games = (await sb.from("games").select("*").order("date",{ascending:true})).data || [];
  render();
}

async function addPlayer(){
  const name = document.getElementById("newPlayer").value.trim();
  if(!name) return;
  await sb.from("players").insert({ name });
  document.getElementById("newPlayer").value = "";
  loadData();
}

async function logWin(which){
  const p1 = document.getElementById("player1").value;
  const p2 = document.getElementById("player2").value;
  if(!p1 || !p2 || p1===p2) return;

  const grouping = document.getElementById("grouping").value;
  const endCondition = document.getElementById("endCondition").value;

  const p1_group = grouping || null;
  const p2_group = grouping==="Solids"?"Stripes":grouping==="Stripes"?"Solids":null;

  await sb.from("games").insert({
    player1:p1,
    player2:p2,
    winner:which===1?p1:p2,
    p1_group,
    p2_group,
    end_condition:endCondition||null,
    date:new Date().toISOString()
  });

  loadData();
}

function compute(){
  const stats={}, elo={}, currentStreak={}, longest={}, solids={}, conditions={};
  let last10 = games.slice(-10);

  games.forEach(g=>{
    [g.player1,g.player2].forEach(p=>{
      if(!stats[p]) stats[p]={w:0,l:0};
      if(!elo[p]) elo[p]=1000;
      if(!currentStreak[p]) currentStreak[p]=0;
      if(!longest[p]) longest[p]=0;
      if(!solids[p]) solids[p]={Solids:0,Stripes:0};
      if(!conditions[p]) conditions[p]={};
    });

    const winner=g.winner;
    const loser=winner===g.player1?g.player2:g.player1;

    stats[winner].w++;
    stats[loser].l++;

    currentStreak[winner]++;
    currentStreak[loser]=0;
    longest[winner]=Math.max(longest[winner],currentStreak[winner]);

    if(g.p1_group==="Solids") solids[g.player1].Solids++;
    if(g.p1_group==="Stripes") solids[g.player1].Stripes++;
    if(g.p2_group==="Solids") solids[g.player2].Solids++;
    if(g.p2_group==="Stripes") solids[g.player2].Stripes++;

    if(g.end_condition){
      conditions[winner][g.end_condition]=(conditions[winner][g.end_condition]||0)+1;
    }

    const expected=1/(1+Math.pow(10,(elo[loser]-elo[winner])/400));
    elo[winner]+=K*(1-expected);
    elo[loser]+=K*(0-(1-expected));
  });

  return {stats,elo,longest,solids,conditions,last10};
}

function render(){
  const {stats,elo,longest,solids,conditions,last10}=compute();

  let overall="";
  Object.entries(stats).sort((a,b)=>b[1].w-a[1].w).forEach(([p,s],i)=>{
    const total=s.w+s.l;
    const pct=total?((s.w/total)*100).toFixed(1):0;
    overall+=`<div class="stat-line ${i===0?'leader':''}">
      ${p}: ${s.w}-${s.l} (${pct}%) | ELO ${Math.round(elo[p])}
    </div>`;
  });
  document.getElementById("overall").innerHTML=overall;

  let streakHTML="";
  Object.entries(longest).forEach(([p,val])=>{
    streakHTML+=`<div>${p}: Longest ${val}</div>`;
  });
  document.getElementById("streaks").innerHTML=streakHTML;

  if(players.length>=2){
    const p1=players[0], p2=players[1];
    const h2hWins=games.filter(g=>g.winner===p1&&g.player1===p2||g.player2===p2).length;
    document.getElementById("h2h").innerHTML=`${p1} vs ${p2}`;
  }

  let adv="";
  Object.entries(solids).forEach(([p,s])=>{
    adv+=`<div>${p}: Solids ${s.Solids}, Stripes ${s.Stripes}</div>`;
    const clean=(conditions[p]["Clean win"]||0);
    const total=stats[p]?.w||0;
    const cleanPct=total?((clean/total)*100).toFixed(1):0;
    adv+=`<div class="small">${p} Clean Win %: ${cleanPct}%</div>`;
  });
  document.getElementById("advanced").innerHTML=adv;

  let l10="";
  last10.forEach(g=>{
    l10+=`<div>${g.winner} beat ${g.winner===g.player1?g.player2:g.player1}</div>`;
  });
  document.getElementById("last10").innerHTML=l10;

  refreshDropdowns();
}

function refreshDropdowns(){
  ["player1","player2"].forEach(id=>{
    const sel=document.getElementById(id);
    sel.innerHTML="<option value=''>Select player</option>";
    players.forEach(p=>sel.innerHTML+=`<option>${p}</option>`);
  });
}

document.getElementById("addPlayerBtn").onclick=addPlayer;
document.getElementById("p1WinBtn").onclick=()=>logWin(1);
document.getElementById("p2WinBtn").onclick=()=>logWin(2);

loadData();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Pool Log</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>

:root{
--bg:#0b0b10;
--card:#14141c;
--muted:#9ca3af;
--text:#e5e7eb;
--line:#2a2a35;

--accent:#6f2dbd;
--accent-hover:#5a23a3;

--shadow:0 6px 25px rgba(0,0,0,0.4);
--radius:14px;
}

body{
font-family:system-ui;
background:
radial-gradient(circle at top left, rgba(111,45,189,0.15), transparent 40%),
radial-gradient(circle at bottom right, rgba(111,45,189,0.1), transparent 50%),
var(--bg);
padding:20px;
max-width:1100px;
margin:auto;
color:var(--text);
}

h1{margin-bottom:16px}

.layout{
display:grid;
grid-template-columns:2fr 1fr;
gap:16px;
}

@media(max-width:900px){
.layout{grid-template-columns:1fr}
}

.grid{
display:grid;
grid-template-columns:1fr;
gap:14px;
}

.card{
background:var(--card);
border-radius:var(--radius);
padding:16px;
box-shadow:var(--shadow);
border:1px solid rgba(255,255,255,0.04);
}

button{
padding:10px 12px;
border:none;
border-radius:10px;
cursor:pointer;
background:var(--accent);
color:white;
font-weight:600;
transition:all 0.2s ease;
}

button:hover{
background:var(--accent-hover);
transform:translateY(-1px);
}

.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}

.btnrow{display:flex;gap:10px;margin-top:10px}

.player-row{
display:flex;
justify-content:space-between;
padding:6px 0;
border-bottom:1px solid var(--line);
}

.pill{
font-size:12px;
padding:3px 8px;
border-radius:999px;
background:rgba(111,45,189,0.2);
margin-left:6px;
}

.game{
padding:8px 0;
border-bottom:1px solid var(--line);
}

.muted{font-size:12px;color:var(--muted)}

.history{
max-height:280px;
overflow-y:auto;
}

/* Standings Table */
.standings-table{
width:100%;
border-collapse:collapse;
font-size:14px;
}

.standings-table th,
.standings-table td{
text-align:left;
padding:8px 6px;
}

.standings-table tr{
border-bottom:1px solid var(--line);
}

.standings-table tr:first-child{
background:rgba(111,45,189,0.15);
font-weight:bold;
}

</style>
</head>

<body>

<h1>🎱 House Pool Log <span class="pill" id="badge"></span></h1>

<div class="layout">

<!-- LEFT SIDE -->
<div class="grid">

<div class="card">

<h2>📝 Log Game</h2>

<div class="row">
<select id="player1"></select>
<select id="player2"></select>
</div>

<div class="btnrow">
<button id="p1WinBtn"></button>
<button id="p2WinBtn"></button>
</div>

<div class="btnrow">
<button id="rematchBtn">🔁 Rematch</button>
</div>

</div>

<div class="card">

<h2>👥 Players</h2>

<div class="row">
<input id="newPlayer" placeholder="Enter player name">
<button id="addPlayerBtn">Add Player</button>
</div>

<div id="playerList"></div>

</div>

<div class="card">

<details open>
<summary>🕙 Game History</summary>

<div id="history" class="history"></div>

<button id="deleteLastBtn">Undo Last Game</button>

</details>

</div>

</div>

<!-- RIGHT SIDE -->
<div class="card">

<h2>🏆 Standings</h2>
<div id="standings"></div>

</div>

</div>

<script>

const VERSION="3.3.0"

const SUPABASE_URL="https://wybycecwkvrukcfoqgpa.supabase.co"
const SUPABASE_KEY="sb_publishable_nNpJJg1ZBcQSjbX1HhPeKg_5KeR8ngb"

const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY)

const K=20

let players=[]
let games=[]

document.getElementById("badge").textContent="v"+VERSION

async function loadData(){

const {data:p}=await sb.from("players").select("name").order("name")
players=p.map(x=>x.name)

const {data:g}=await sb.from("games").select("*").order("date",{ascending:false})
games=g

renderAll()

}

function renderPlayers(){

const p1=document.getElementById("player1")
const p2=document.getElementById("player2")

p1.innerHTML=players.map(p=>`<option>${p}</option>`).join("")
p2.innerHTML=players.map(p=>`<option>${p}</option>`).join("")

p1.onchange=updateButtons
p2.onchange=updateButtons

updateButtons()

const list=document.getElementById("playerList")

list.innerHTML=players.map(p=>`

<div class="player-row">

<div>${p}</div>

<div>
<button onclick="editPlayer('${p}')">Edit</button>
<button onclick="deletePlayer('${p}')">Delete</button>
</div>

</div>

`).join("")

}

async function addPlayer(){

let name=document.getElementById("newPlayer").value.trim()

if(!name){
alert("Enter a player name.")
return
}

if(players.includes(name)){
alert("Player already exists.")
return
}

await sb.from("players").insert({name})

document.getElementById("newPlayer").value=""

loadData()

}

async function editPlayer(oldName){

let newName=prompt("Edit player name",oldName)

if(!newName)return

newName=newName.trim()

await sb.from("players").update({name:newName}).eq("name",oldName)

await sb.from("games").update({player1:newName}).eq("player1",oldName)
await sb.from("games").update({player2:newName}).eq("player2",oldName)
await sb.from("games").update({winner:newName}).eq("winner",oldName)

loadData()

}

async function deletePlayer(name){

let used=games.some(g=>g.player1===name||g.player2===name)

if(used){
alert("Cannot delete player with logged games.")
return
}

if(!confirm("Delete "+name+" ?"))return

await sb.from("players").delete().eq("name",name)

loadData()

}

function updateButtons(){

const p1=document.getElementById("player1").value||"Player 1"
const p2=document.getElementById("player2").value||"Player 2"

document.getElementById("p1WinBtn").textContent=p1+" Won"
document.getElementById("p2WinBtn").textContent=p2+" Won"

}

async function logWin(which){

const p1=document.getElementById("player1").value
const p2=document.getElementById("player2").value

if(p1===p2){
alert("Players must be different.")
return
}

await sb.from("games").insert({
player1:p1,
player2:p2,
winner:which===1?p1:p2,
date:new Date().toISOString()
})

loadData()

}

function quickRematch(){

const p1=document.getElementById("player1")
const p2=document.getElementById("player2")

let temp=p1.value
p1.value=p2.value
p2.value=temp

updateButtons()

}

async function deleteLast(){

if(!games.length)return

if(!confirm("Delete last game?"))return

await sb.from("games").delete().eq("id",games[0].id)

loadData()

}

function computeStats(){

const stats={},elo={}

games.slice().reverse().forEach(g=>{

[g.player1,g.player2].forEach(p=>{
if(!stats[p])stats[p]={w:0,l:0}
if(!elo[p])elo[p]=1000
})

const winner=g.winner
const loser=winner===g.player1?g.player2:g.player1

stats[winner].w++
stats[loser].l++

const exp=1/(1+Math.pow(10,(elo[loser]-elo[winner])/400))

elo[winner]+=K*(1-exp)
elo[loser]+=K*(0-(1-exp))

})

return{stats,elo}

}

function renderStandings(){

const {stats,elo}=computeStats()

const list=Object.entries(stats)

list.sort((a,b)=>elo[b[0]]-elo[a[0]])

document.getElementById("standings").innerHTML=`

<table class="standings-table">
<tr>
<th>#</th>
<th>Player</th>
<th>Record</th>
<th>ELO</th>
<th>Win %</th>
</tr>

${list.map(([p,s],i)=>{

const games=s.w+s.l
const pct=((s.w/games)*100).toFixed(1)

return`
<tr>
<td>${i+1}</td>
<td><b>${p}</b></td>
<td>${s.w}-${s.l}</td>
<td>${Math.round(elo[p])}</td>
<td>${pct}%</td>
</tr>
`

}).join("")}

</table>
`

}

function renderHistory(){

document.getElementById("history").innerHTML=

games.map(g=>`

<div class="game">

<div class="muted">${new Date(g.date).toLocaleString()}</div>

<b>${g.winner}</b> beat ${g.winner===g.player1?g.player2:g.player1}

</div>

`).join("")

}

function renderAll(){

renderPlayers()
renderStandings()
renderHistory()

}

document.getElementById("p1WinBtn").onclick=()=>logWin(1)
document.getElementById("p2WinBtn").onclick=()=>logWin(2)
document.getElementById("rematchBtn").onclick=quickRematch
document.getElementById("addPlayerBtn").onclick=addPlayer
document.getElementById("deleteLastBtn").onclick=deleteLast

loadData()

</script>

</body>
</html>

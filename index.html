<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Pool Log</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
:root{
--bg:#0b0b10;
--card:#14141c;
--text:#e5e7eb;
--accent:#6f2dbd;
--radius:14px;
}

body{
font-family:system-ui;
background:var(--bg);
color:var(--text);
padding:14px;
max-width:900px;
margin:auto;
}

.card{
background:var(--card);
padding:14px;
border-radius:var(--radius);
margin-bottom:12px;
}

.row{display:flex;gap:10px}
.row>*{flex:1}

button{
padding:14px;
border:none;
border-radius:10px;
background:var(--accent);
color:white;
font-size:16px;
font-weight:bold;
}

select,input{
padding:12px;
border-radius:10px;
border:none;
font-size:16px;
}

.stat{
background:#111;
padding:8px;
border-radius:10px;
margin-top:6px;
}

.big{
font-size:20px;
font-weight:bold;
}
</style>
</head>

<body>

<h2>🎱 Pool Log</h2>

<div class="card">

<div class="row">
<select id="player1"></select>
<select id="player2"></select>
</div>

<div class="row">
<button id="p1WinBtn"></button>
<button id="p2WinBtn"></button>
</div>

<button id="rematchBtn">🔁 Rematch</button>

<div id="h2h"></div>

</div>

<div class="card">
<input id="newPlayer" placeholder="Player name">
<button id="addPlayerBtn">Add Player</button>
</div>

<div class="card" id="king"></div>
<div class="card" id="potn"></div>
<div class="card" id="standings"></div>
<div class="card" id="playerStats"></div>

<div class="card">
<div id="history"></div>
<button id="deleteLastBtn">Undo</button>
</div>

<script>

const sb=supabase.createClient(
"https://wybycecwkvrukcfoqgpa.supabase.co",
"sb_publishable_nNpJJg1ZBcQSjbX1HhPeKg_5KeR8ngb"
)

let players=[],games=[]
const K=20

async function loadData(){
const {data:p}=await sb.from("players").select("name").order("name")
players=p?.map(x=>x.name)||[]

const {data:g}=await sb.from("games").select("*").order("date",{ascending:false})
games=g||[]

renderAll()
}

function renderPlayers(){
player1.innerHTML=players.map(p=>`<option>${p}</option>`).join("")
player2.innerHTML=players.map(p=>`<option>${p}</option>`).join("")
updateButtons()
}

function updateButtons(){
p1WinBtn.textContent=player1.value+" Won"
p2WinBtn.textContent=player2.value+" Won"
renderH2H()
}

function renderH2H(){
let p1=player1.value,p2=player2.value
let w1=0,w2=0

games.forEach(g=>{
if((g.player1===p1&&g.player2===p2)||(g.player1===p2&&g.player2===p1)){
if(g.winner===p1)w1++
if(g.winner===p2)w2++
}
})

h2h.innerHTML=`${p1} leads ${p2} ${w1}-${w2}`
}

async function logWin(which){
let p1=player1.value,p2=player2.value
await sb.from("games").insert({player1:p1,player2:p2,winner:which===1?p1:p2})
loadData()
}

addPlayerBtn.onclick=async()=>{
let name=newPlayer.value.trim()
if(!name)return
await sb.from("players").insert({name})
newPlayer.value=""
loadData()
}

deleteLastBtn.onclick=async()=>{
if(!games.length)return
await sb.from("games").delete().eq("id",games[0].id)
loadData()
}

function computeStats(){

let stats={},elo={}

games.slice().reverse().forEach(g=>{

[g.player1,g.player2].forEach(p=>{
if(!stats[p])stats[p]={w:0,l:0,history:[]}
if(!elo[p])elo[p]=1000
})

let w=g.winner
let l=w===g.player1?g.player2:g.player1

stats[w].w++
stats[l].l++

stats[w].history.push(1)
stats[l].history.push(0)

let exp=1/(1+Math.pow(10,(elo[l]-elo[w])/400))
elo[w]+=K*(1-exp)
elo[l]+=K*(0-(1-exp))

})

return {stats,elo}
}

function trendArrow(arr){
let sum=arr.slice(-5).reduce((a,b)=>a+b,0)
if(sum>=4)return "📈"
if(sum<=1)return "📉"
return "➡️"
}

function renderStandings(){
let {stats,elo}=computeStats()

standings.innerHTML=Object.entries(stats)
.sort((a,b)=>elo[b[0]]-elo[a[0]])
.map(([p,s],i)=>`
<div class="stat">
${i+1}. ${p} (${s.w}-${s.l}) | ELO ${Math.round(elo[p])}
</div>
`).join("")
}

function renderKing(){

if(!games.length){king.innerHTML="No games";return}

let best=0,cur=0,last=null

games.slice().reverse().forEach(g=>{
if(g.winner===last){cur++}else{cur=1;last=g.winner}
best=Math.max(best,cur)
})

king.innerHTML=`👑 Current: ${games[0].winner}<br>🔥 Best streak: ${best}`
}

function renderPlayerStats(){

let {stats,elo}=computeStats()

playerStats.innerHTML=Object.entries(stats).map(([p,s])=>{

let total=s.w+s.l
let pct=((s.w/total)*100||0).toFixed(1)
let last10=s.history.slice(-10)

return `
<div class="stat">
<b>${p}</b><br>
Win%: ${pct}%<br>
ELO: ${Math.round(elo[p])}<br>
Last10: ${last10.map(x=>x?"W":"L").join("")} ${trendArrow(last10)}
</div>
`

}).join("")
}

function renderPOTN(){

let today=games.slice(0,20)

let score={}

today.forEach(g=>{
if(!score[g.winner])score[g.winner]=0
score[g.winner]++
})

let best=Object.entries(score).sort((a,b)=>b[1]-a[1])[0]

potn.innerHTML=best?`🏆 Player of the Night: ${best[0]} (${best[1]} wins)`:""
}

function renderHistory(){
history.innerHTML=games.map(g=>`
${g.winner} beat ${g.winner===g.player1?g.player2:g.player1}<br>
`).join("")
}

function renderAll(){
renderPlayers()
renderStandings()
renderKing()
renderPlayerStats()
renderPOTN()
renderHistory()
updateButtons()
}

p1WinBtn.onclick=()=>logWin(1)
p2WinBtn.onclick=()=>logWin(2)

rematchBtn.onclick=()=>{
let t=player1.value
player1.value=player2.value
player2.value=t
updateButtons()
}

loadData()

</script>

</body>
</html>

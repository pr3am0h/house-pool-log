<!-- EVERYTHING ELSE (HTML/CSS) STAYS SAME STRUCTURE -->

<script>

const VERSION="5.0.0"

let mode="house"
let kingMode=false

async function loadData(){

const {data:p}=await sb.from("players").select("name").order("name")
players=p?.map(x=>x.name)||[]

const {data:g}=await sb.from("games").select("*").order("date",{ascending:false})
games=g||[]

await seedKdubWins()

renderAll()
}

async function seedKdubWins(){

// prevent duplicate seeding
if(games.some(g=>g.seed_tag==="kdub_seed")) return

let lastWed=new Date()
lastWed.setDate(lastWed.getDate() - ((lastWed.getDay()+4)%7))

for(let i=0;i<2;i++){
await sb.from("games").insert({
player1:"Kdub",
player2:"Stuffy",
winner:"Kdub",
date:lastWed.toISOString(),
seed_tag:"kdub_seed"
})
}

const {data:g}=await sb.from("games").select("*").order("date",{ascending:false})
games=g||[]
}

function updateButtons(){

const p1=player1.value||"Player 1"
const p2=player2.value||"Player 2"

p1WinBtn.textContent=p1+" Won"
p2WinBtn.textContent=p2+" Won"
}

player1.onchange=updateButtons
player2.onchange=updateButtons

async function logWin(which){

const p1=player1.value
const p2=player2.value
let winner=which===1?p1:p2
let loser=which===1?p2:p1
let type=winType?.value || ""

if(mode==="apa"){

if(!type){
alert("Select win type for APA")
return
}

if(type==="Scratch on 8"){
winner=loser
}
}

await sb.from("games").insert({
player1:p1,
player2:p2,
winner,
win_type:type
})

if(kingMode){
player1.value=winner
}

loadData()
}

function computeStats(){

const stats={},elo={},history={}

games.slice().reverse().forEach(g=>{

[g.player1,g.player2].forEach(p=>{
if(!stats[p])stats[p]={w:0,l:0,history:[]}
if(!elo[p])elo[p]=1000
})

let w=g.winner
let l=w===g.player1?g.player2:g.player1

stats[w].w++
stats[l].l++

stats[w].history.push(1)
stats[l].history.push(0)

let exp=1/(1+Math.pow(10,(elo[l]-elo[w])/400))
elo[w]+=20*(1-exp)
elo[l]+=20*(0-(1-exp))
})

return{stats,elo}
}

function renderKing(){

if(!games.length){
king.innerHTML="No games yet"
return
}

let best=0,cur=0,last=null

games.slice().reverse().forEach(g=>{
if(g.winner===last){cur++}
else{cur=1;last=g.winner}
best=Math.max(best,cur)
})

king.innerHTML=`
👑 Current: <b>${games[0].winner}</b><br>
🔥 Streak: ${cur}<br>
🏆 Best: ${best}
`
}

function renderStandings(){

const {stats,elo}=computeStats()

const list=Object.entries(stats).sort((a,b)=>elo[b[0]]-elo[a[0]])

standings.innerHTML=`
<table class="standings-table">
<tr><th>#</th><th>Player</th><th>Record</th><th>ELO</th></tr>
${list.map(([p,s],i)=>`
<tr>
<td>${i+1}</td>
<td><b>${p}</b></td>
<td>${s.w}-${s.l}</td>
<td>${Math.round(elo[p])}</td>
</tr>
`).join("")}
</table>
`
}

function renderRules(){

rules.innerHTML=`
<h3>📜 Rules</h3>

<b>🏠 House Rules (Default)</b><br>
Games are casual and fast-paced. No called shots are required and any ball that goes in counts. 
Pocketing the 8 ball wins the game. Scratching on the 8 ball results in a loss. 
If the 8 ball is pocketed early, the player loses. Play continues quickly with minimal disputes.<br><br>

<b>🎱 APA 8-Ball Rules</b><br>
Shots must be called. Players must hit their assigned group first. 
The 8 ball may only be attempted after clearing your group. 
Scratching on the 8 ball results in an automatic loss. 
Pocketing the 8 ball early is also a loss. Defensive shots are allowed.
`
}

function renderAll(){
renderPlayers()
renderStandings()
renderHistory()
renderKing()
renderRules()
updateButtons()
}

modeBtn?.addEventListener("click",()=>{
mode=mode==="house"?"apa":"house"
modeBtn.textContent=mode==="house"?"🏠 House Mode":"🎱 APA Mode"
})

kingModeBtn?.addEventListener("click",()=>{
kingMode=!kingMode
kingModeBtn.textContent=`👑 King Mode: ${kingMode?"ON":"OFF"}`
})

</script>

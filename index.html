<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>House Pool Log</title>

  <!-- Supabase v2 (CDN) -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <!-- QR Code -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 16px;
      max-width: 500px;
      margin: auto;
    }
    h2 { margin-top: 24px; }
    button {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      margin-top: 8px;
    }
    button:disabled { opacity: 0.4; }
    select, input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin-top: 6px;
    }
    .row { margin-bottom: 12px; }
    .win-btn { font-weight: bold; }
    .tally {
      background: #f4f4f4;
      padding: 12px;
      border-radius: 6px;
    }
    .date-label { font-size: 15px; color: #555; }
    .past-day {
      border-bottom: 1px solid #ddd;
      padding-bottom: 8px;
      margin-bottom: 8px;
    }
    .admin-banner {
      background: #222;
      color: #fff;
      padding: 6px;
      text-align: center;
      display: none;
      font-size: 13px;
    }
    .qr-box {
      text-align: center;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px dashed #ccc;
    }
    .qr-note {
      font-size: 14px;
      color: #555;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<div id="adminBanner" class="admin-banner">ADMIN MODE</div>

<h1>🎱 House Pool Log</h1>

<div class="row">
  <h2>Add Player</h2>
  <input id="newPlayer" placeholder="Player name" />
  <button id="addPlayerBtn">Add Player</button>
</div>

<div class="row">
  <h2>At the Table</h2>
  <select id="player1"></select>
  <select id="player2"></select>
</div>

<div class="row">
  <h2>Log Win</h2>
  <button class="win-btn" id="p1WinBtn" disabled>Player 1 Won</button>
  <button class="win-btn" id="p2WinBtn" disabled>Player 2 Won</button>

  <select id="endCondition">
    <option value="">(Optional) End Condition</option>
    <option>Clean win</option>
    <option>Opponent scratched on 8</option>
    <option>Opponent sank 8 early</option>
    <option>Opponent missed 8</option>
  </select>

  <button id="undoBtn">Undo Last Game</button>
</div>

<div class="row">
  <h2>Today</h2>
  <div class="date-label" id="todayLabel"></div>
  <div class="tally" id="tally"></div>
</div>

<div class="row">
  <h2>Past Days</h2>
  <div id="pastDays"></div>
</div>

<div class="qr-box">
  <h2>Scan to Log a Game</h2>
  <div id="qrcode"></div>
  <div class="qr-note">Open on your phone to log games</div>
</div>

<script>
(() => {
  "use strict";

  /* ================= CONFIG ================= */
  const APP_URL = "https://pr3am0h.github.io/house-pool-log/";

  const SUPABASE_URL = "https://wybycecwkvrukcfoqgpa.supabase.co";
  const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind5YnljZWN3a3ZydWtjZm9xZ3BhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY5NTc2MTksImV4cCI6MjA4MjUzMzYxOX0.nagtzOiCuUvRnkxKbVVmQ-ycYpWaA2e-3nHjYF3L0UU";

  // Guardrail: fail loudly if the CDN didn't load
  if (!window.supabase?.createClient) {
    console.error("Supabase CDN not loaded. Check the <script src=...> tag.");
    alert("Supabase failed to load. Please refresh the page.");
    return;
  }

  // ✅ ONLY ONE SUPABASE CLIENT (scoped to this IIFE so it can't collide)
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  /* ================= DOM ================= */
  const el = {
    adminBanner: document.getElementById("adminBanner"),

    newPlayer: document.getElementById("newPlayer"),
    addPlayerBtn: document.getElementById("addPlayerBtn"),

    player1: document.getElementById("player1"),
    player2: document.getElementById("player2"),

    p1WinBtn: document.getElementById("p1WinBtn"),
    p2WinBtn: document.getElementById("p2WinBtn"),

    endCondition: document.getElementById("endCondition"),
    undoBtn: document.getElementById("undoBtn"),

    todayLabel: document.getElementById("todayLabel"),
    tally: document.getElementById("tally"),
    pastDays: document.getElementById("pastDays"),

    qrcode: document.getElementById("qrcode"),
  };

  /* ================= DATE ================= */
  const today = new Date().toISOString().slice(0, 10);
  el.todayLabel.textContent = new Date().toLocaleDateString(undefined, {
    weekday: "long",
    month: "short",
    day: "numeric",
    year: "numeric",
  });

  /* ================= STATE ================= */
  let players = [];
  let games = [];
  let adminMode = false;

  /* ================= HELPERS ================= */
  function safeTrim(v) { return (v ?? "").toString().trim(); }

  function showError(prefix, error) {
    console.error(prefix, error);
    // keep UI usable; only alert on things a user can act on
  }

  /* ================= LOAD ================= */
  async function loadData() {
    const p = await sb.from("players").select("name").order("name", { ascending: true });
    if (p.error) showError("Failed to load players:", p.error);
    players = (p.data || []).map(x => x.name);

    const g = await sb.from("games").select("*").order("date", { ascending: false }).order("id", { ascending: true });
    if (g.error) showError("Failed to load games:", g.error);
    games = g.data || [];

    refreshUI();
    refreshAll();
  }

  /* ================= PLAYERS ================= */
  async function addPlayer() {
    const name = safeTrim(el.newPlayer.value);
    if (!name) return;
    if (players.includes(name)) return;

    const res = await sb.from("players").insert({ name });
    if (res.error) {
      showError("Failed to add player:", res.error);
      alert("Failed to add player (see console).");
      return;
    }

    el.newPlayer.value = "";
    await loadData();
  }

  /* ================= GAMES ================= */
  async function logWin(which) {
    const p1 = el.player1.value;
    const p2 = el.player2.value;
    if (!p1 || !p2 || p1 === p2) return;

    const winner = which === 1 ? p1 : p2;
    const loser  = which === 1 ? p2 : p1;

    const res = await sb.from("games").insert({
      date: today,
      winner,
      loser,
      end_condition: el.endCondition.value || null
    });

    if (res.error) {
      showError("Failed to log game:", res.error);
      alert("Failed to log game (see console).");
      return;
    }

    el.endCondition.value = "";
    await loadData();
  }

  async function undoLastGame() {
    const todayGames = games.filter(g => g.date === today);
    if (!todayGames.length) return;

    const last = todayGames.at(-1);
    const res = await sb.from("games").delete().eq("id", last.id);

    if (res.error) {
      showError("Failed to undo last game:", res.error);
      alert("Failed to undo (see console).");
      return;
    }

    await loadData();
  }

  /* ================= UI ================= */
  function refreshUI() {
    for (const sel of [el.player1, el.player2]) {
      sel.innerHTML = "";
      sel.appendChild(new Option("Select player", ""));
      players.forEach(p => sel.appendChild(new Option(p, p)));
    }
    updateState();
  }

  function refreshTally() {
    el.tally.innerHTML = "";
    const map = {};

    games.filter(g => g.date === today).forEach(g => {
      map[g.winner] = (map[g.winner] || 0) + 1;
    });

    const entries = Object.entries(map).sort((a,b) => b[1] - a[1]);

    for (const [name, count] of entries) {
      const d = document.createElement("div");
      d.textContent = `${name}: ${count}`;
      el.tally.appendChild(d);
    }

    if (!entries.length) el.tally.textContent = "No games logged today.";
  }

  function refreshPastDays() {
    el.pastDays.innerHTML = "";

    const nonToday = games.filter(g => g.date !== today);

    if (!nonToday.length) {
      el.pastDays.textContent = "No past days yet.";
      return;
    }

    // Group by date (newest first)
    const byDate = new Map();
    for (const g of nonToday) {
      if (!byDate.has(g.date)) byDate.set(g.date, []);
      byDate.get(g.date).push(g);
    }

    const dates = Array.from(byDate.keys()).sort((a,b) => (a < b ? 1 : -1));

    for (const dte of dates) {
      const header = document.createElement("div");
      header.className = "past-day";
      header.style.fontWeight = "bold";
      header.textContent = dte;
      el.pastDays.appendChild(header);

      for (const g of byDate.get(dte)) {
        const row = document.createElement("div");
        row.style.paddingLeft = "8px";
        row.textContent = `${g.winner} beat ${g.loser}${g.end_condition ? " (" + g.end_condition + ")" : ""}`;
        el.pastDays.appendChild(row);
      }
    }
  }

  function refreshAll() {
    refreshTally();
    refreshPastDays();
  }

  function updateState() {
    el.p1WinBtn.textContent = el.player1.value ? `${el.player1.value} Won` : "Player 1 Won";
    el.p2WinBtn.textContent = el.player2.value ? `${el.player2.value} Won` : "Player 2 Won";

    const ok = el.player1.value && el.player2.value && el.player1.value !== el.player2.value;
    el.p1WinBtn.disabled = !ok;
    el.p2WinBtn.disabled = !ok;
  }

  /* ================= EVENTS ================= */
  el.addPlayerBtn.addEventListener("click", addPlayer);
  el.newPlayer.addEventListener("keydown", (e) => {
    if (e.key === "Enter") addPlayer();
  });

  el.player1.addEventListener("change", updateState);
  el.player2.addEventListener("change", updateState);

  el.p1WinBtn.addEventListener("click", () => logWin(1));
  el.p2WinBtn.addEventListener("click", () => logWin(2));

  el.undoBtn.addEventListener("click", undoLastGame);

  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "a") {
      adminMode = !adminMode;
      el.adminBanner.style.display = adminMode ? "block" : "none";
    }
  });

  /* ================= QR ================= */
  // Avoid duplicate QR if the script runs twice for any reason
  el.qrcode.innerHTML = "";
  new QRCode(el.qrcode, { text: APP_URL, width: 180, height: 180 });

  /* ================= INIT ================= */
  loadData();

})();
</script>

</body>
</html>

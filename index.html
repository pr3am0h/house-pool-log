<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>House Pool Log</title>

  <!-- Supabase v2 (CDN) -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <!-- QR Code -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 16px;
      max-width: 500px;
      margin: auto;
    }
    h2 { margin-top: 24px; }
    button {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      margin-top: 8px;
    }
    button:disabled { opacity: 0.4; }
    select, input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin-top: 6px;
    }
    .row { margin-bottom: 12px; }
    .win-btn { font-weight: bold; }
    .tally {
      background: #f4f4f4;
      padding: 12px;
      border-radius: 6px;
    }
    .date-label { font-size: 15px; color: #555; }
    .past-day {
      border-bottom: 1px solid #ddd;
      padding-bottom: 8px;
      margin-bottom: 8px;
    }
    .admin-banner {
      background: #222;
      color: #fff;
      padding: 6px;
      text-align: center;
      display: none;
      font-size: 13px;
    }
    .qr-box {
      text-align: center;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px dashed #ccc;
    }
    .qr-note {
      font-size: 14px;
      color: #555;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<div id="adminBanner" class="admin-banner">ADMIN MODE</div>

<h1>🎱 House Pool Log</h1>

<div class="row">
  <h2>Add Player</h2>
  <input id="newPlayer" placeholder="Player name" />
  <button id="addPlayerBtn">Add Player</button>
</div>

<div class="row">
  <h2>At the Table</h2>
  <select id="player1"></select>
  <select id="player2"></select>
</div>

<div class="row">
  <h2>Log Win</h2>
  <button class="win-btn" id="p1WinBtn" disabled>Player 1 Won</button>
  <button class="win-btn" id="p2WinBtn" disabled>Player 2 Won</button>

  <select id="endCondition">
    <option value="">(Optional) End Condition</option>
    <option>Clean win</option>
    <option>Opponent scratched on 8</option>
    <option>Opponent sank 8 early</option>
    <option>Opponent missed 8</option>
  </select>

  <button id="undoBtn">Undo Last Game</button>
</div>

<div class="row">
  <h2>Today</h2>
  <div class="date-label" id="todayLabel"></div>
  <div class="tally" id="tally"></div>
</div>

<div class="row">
  <h2>Past Days</h2>
  <div id="pastDays"></div>
</div>

<div class="qr-box">
